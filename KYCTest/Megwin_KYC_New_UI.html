<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEGWIN | KYC Verification</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0c;
        --top: #1b1b1d;
        --panel: #1b1b1d;
        --panel2: #232326;
        --line: #323236;
        --text: #eeeef0;
        --muted: #96969a;
        --teal: #41d2bf;
        --red: #ef535c;
        --yellow: #e6bd5b;
        --font: Inter, "Segoe UI", Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      .topline {
        height: 42px;
        background: var(--top);
        border-bottom: 1px solid #2b2b2d;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        color: #a3a3a8;
        font-size: 12px;
      }
      .topline .right {
        display: flex;
        gap: 24px;
        align-items: center;
      }
      .nav {
        height: 49px;
        display: flex;
        align-items: center;
        gap: 30px;
        padding: 0 18px;
        border-bottom: 1px solid #272729;
        background: #0e0e0f;
      }
      .hamburger {
        font-size: 22px;
        color: #f3f3f3;
      }
      .brand {
        font-size: 29px;
        font-weight: 950;
        letter-spacing: -1.8px;
        font-style: italic;
        white-space: nowrap;
      }
      .brand em {
        color: var(--teal);
        font-style: italic;
      }
      .navlinks {
        display: flex;
        gap: 20px;
        align-items: center;
        color: #8f8f93;
        font-size: 12px;
        font-weight: 700;
      }
      .navlinks span.active {
        color: #f5f5f5;
        background: #262629;
        padding: 9px 13px;
        border-radius: 24px;
      }
      .nav-right {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .nav-chip {
        background: #1e1e20;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 12px;
        color: #bcbcc0;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #2b2b2f;
        color: #929298;
      }
      .shell {
        display: grid;
        grid-template-columns: 232px minmax(0, 1fr);
        gap: 12px;
      }
      .sidebar {
        padding: 12px 10px;
        min-height: calc(100vh - 91px);
      }
      .menu {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 10px;
        color: #939397;
        font-weight: 650;
        margin-bottom: 3px;
        white-space: nowrap;
      }
      .menu.active {
        background: #27272a;
        color: #f1f1f3;
      }
      .menu .mi {
        width: 18px;
        text-align: center;
        color: #77777c;
      }
      .menu.active .mi {
        color: #fff;
      }
      .main {
        padding: 12px 22px 70px 0;
      }
      .kyc {
        width: min(920px, 100%);
        background: var(--panel);
        border-radius: 12px;
        padding: 24px 23px 22px;
        min-height: 294px;
      }
      .kyc h1 {
        font-size: 29px;
        line-height: 1.25;
        margin: 0 0 11px;
        font-weight: 750;
        letter-spacing: -0.7px;
      }
      .section-title {
        font-size: 15px;
        font-weight: 750;
        margin: 0 0 5px;
      }
      .muted {
        color: var(--muted);
        line-height: 1.5;
      }
      .small {
        font-size: 12px;
      }
      .uploads {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 16px 0 14px;
      }
      .upload {
        border: 1px dashed #48484d;
        border-radius: 8px;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px;
        background: #1b1b1d;
        color: #ddd;
        font-size: 12px;
        text-align: center;
        transition: 0.2s;
      }
      .upload:hover {
        border-color: var(--teal);
        background: #202628;
      }
      .upload b {
        color: var(--teal);
        font-size: 19px;
      }
      .upload.selected {
        border-color: var(--teal);
        color: var(--teal);
      }
      .upload input {
        display: none;
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 15px 0;
      }
      .notice {
        font-size: 13px;
        color: #a2a2a6;
        line-height: 1.48;
      }
      .notice h3 {
        font-size: 13px;
        color: #ececef;
        margin: 15px 0 6px;
      }
      .notice ul {
        margin: 5px 0;
        padding-left: 19px;
      }
      .notice li {
        margin: 4px 0;
      }
      .notice li::marker {
        color: #77777c;
      }
      .btn {
        border: 0;
        border-radius: 9px;
        padding: 12px 17px;
        font-weight: 700;
        min-height: 43px;
      }
      .btn-main {
        background: var(--teal);
        color: #0c2220;
      }
      .btn-main:hover:not(:disabled) {
        background: #6ce6d7;
      }
      .btn-soft {
        background: #2b2b2e;
        color: #eee;
      }
      .btn-soft:hover:not(:disabled) {
        background: #38383c;
      }
      .btn-outline {
        background: transparent;
        border: 1px solid #45454b;
        color: #d8d8dc;
      }
      .btn-wide {
        width: 100%;
        margin-top: 16px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .split {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .badge {
        font-size: 11px;
        font-weight: 750;
        border-radius: 30px;
        padding: 6px 10px;
        background: #2c2b27;
        color: var(--yellow);
      }
      .badge.good {
        color: var(--teal);
        background: #1d3430;
      }
      .badge.bad {
        color: #ff8289;
        background: #382629;
      }
      .progress {
        display: flex;
        gap: 7px;
        margin: 18px 0 21px;
      }
      .progress div {
        height: 4px;
        flex: 1;
        border-radius: 5px;
        background: #353538;
      }
      .progress div.on {
        background: var(--teal);
      }
      .flow {
        max-width: 620px;
        margin: 8px auto 0;
      }
      .flow h2 {
        font-size: 19px;
        margin: 0 0 8px;
      }
      .flow p {
        color: #aaaab0;
        line-height: 1.6;
      }
      .tip {
        background: #222225;
        border: 1px solid #35353a;
        padding: 13px 15px;
        border-radius: 9px;
        color: #adadb2;
        font-size: 12px;
        line-height: 1.55;
        margin: 14px 0;
      }
      .choice {
        border: 1px solid #414146;
        border-radius: 9px;
        padding: 13px 15px;
        margin: 8px 0;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
      }
      .choice:has(input:checked) {
        border-color: var(--teal);
        background: #202b2a;
      }
      .choice input {
        accent-color: var(--teal);
      }
      .field {
        display: block;
        font-size: 12px;
        color: #aaa;
        margin: 15px 0 6px;
      }
      .input {
        background: #111113;
        border: 1px solid #424247;
        border-radius: 8px;
        color: #eee;
        width: 100%;
        padding: 12px;
        outline: 0;
      }
      .input:focus {
        border-color: var(--teal);
      }
      .preview {
        border: 1px dashed #515158;
        background: #202023;
        border-radius: 12px;
        min-height: 180px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
        color: #aaa;
        gap: 9px;
      }
      .preview .illustration {
        font-size: 55px;
        color: var(--teal);
      }
      .fileinfo {
        font-size: 12px;
        color: var(--teal);
        margin-top: 8px;
        word-break: break-word;
      }
      .result {
        text-align: center;
        padding: 40px 15px 14px;
      }
      .result .symbol {
        font-size: 68px;
        line-height: 1.2;
        margin-bottom: 17px;
      }
      .result h2 {
        font-size: 15px;
        margin: 0 0 6px;
      }
      .result p {
        max-width: 680px;
        margin: 0 auto;
        color: #a0a0a5;
        line-height: 1.55;
        font-size: 13px;
      }
      .result .btn {
        width: min(455px, 100%);
        margin-top: 16px;
      }
      .result.good .symbol {
        color: var(--teal);
      }
      .result.bad .symbol {
        color: var(--red);
      }
      .result.pending .symbol {
        color: var(--yellow);
      }
      .status-line {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: #a5a5aa;
        margin: 12px 0 0;
      }
      .dot {
        width: 8px;
        height: 8px;
        background: var(--yellow);
        border-radius: 50%;
      }
      .demo-switch {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #999;
        margin: 14px 0 0;
      }
      .demo-switch input {
        accent-color: var(--teal);
      }
      .demo-controls {
        margin-top: 15px;
        border-top: 1px solid #353539;
        padding-top: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .demo-controls .btn {
        min-height: 34px;
        padding: 7px 12px;
        font-size: 12px;
      }
      .demo-label {
        font-size: 11px;
        color: #b8a26a;
        margin-right: 4px;
      }
      .hide {
        display: none !important;
      }
      .error {
        color: #ff888e;
        font-size: 12px;
        margin-top: 8px;
      }
      .footer-note {
        margin-top: 15px;
        font-size: 11px;
        color: #6f6f75;
      }
      .camera-circle {
        height: 112px;
        width: 112px;
        border: 2px dashed #64cbbb;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 53px;
        margin: 10px auto;
      }
      .checkboxline {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 12px;
        color: #b7b7bc;
        line-height: 1.5;
        margin: 17px 0;
      }
      .checkboxline input {
        accent-color: var(--teal);
        margin-top: 2px;
      }
      .back {
        background: transparent;
        border: 0;
        color: #a9a9af;
        padding: 12px 0;
      }
      .api-info {
        font-size: 11px;
        color: #8f8f95;
        margin-top: 10px;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 4px solid #37373b;
        border-top-color: var(--teal);
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (max-width: 1050px) {
        .navlinks {
          gap: 9px;
        }
        .shell {
          grid-template-columns: 205px minmax(0, 1fr);
        }
        .main {
          padding-right: 12px;
        }
      }
      @media (max-width: 760px) {
        .topline {
          height: 30px;
          padding: 0 12px;
        }
        .topline .right {
          gap: 12px;
        }
        .nav {
          height: 55px;
          padding: 0 12px;
          gap: 12px;
        }
        .brand {
          font-size: 25px;
        }
        .navlinks {
          display: none;
        }
        .nav-chip:nth-child(1) {
          display: none;
        }
        .shell {
          display: block;
        }
        .sidebar {
          min-height: auto;
          padding: 10px 12px 0;
          display: flex;
          overflow-x: auto;
          gap: 4px;
        }
        .menu {
          font-size: 12px;
          min-width: max-content;
          padding: 10px 12px;
        }
        .menu:not(.active) {
          display: none;
        }
        .main {
          padding: 12px 12px 35px;
        }
        .kyc {
          padding: 20px 15px;
          border-radius: 10px;
        }
        .kyc h1 {
          font-size: 25px;
        }
        .uploads {
          grid-template-columns: 1fr;
        }
        .notice {
          font-size: 12px;
        }
        .result {
          padding: 30px 4px 16px;
        }
        .result .symbol {
          font-size: 61px;
        }
        .flow {
          margin-top: 4px;
        }
      }

      .checkboxline a {
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .unico-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:18px 0 24px}
      .unico-step{border:1px solid #39393d;border-radius:10px;background:#222225;padding:13px 10px;min-width:0}
      .unico-step.current{border-color:var(--teal);background:#1e302e}.unico-step.done{border-color:#35645e}
      .unico-step .step-head{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:750}
      .unico-step .number{display:grid;place-items:center;width:24px;height:24px;flex-shrink:0;border-radius:50%;background:#36363b;color:#ddd}
      .unico-step.current .number,.unico-step.done .number{background:var(--teal);color:#102522}
      .unico-step p{font-size:11px;color:#a3a3aa;line-height:1.45;margin:8px 0 0}
      .step-panel{max-width:700px;margin:auto}.step-panel h2{font-size:22px;margin:0 0 10px}.step-panel>p{color:#aaa;line-height:1.65}
      .step-panel .preview{margin:20px 0;min-height:210px}.step-panel .row{justify-content:space-between}
      .mode-note{font-size:12px;color:#a7a7ad;margin-top:15px}
      @media(max-width:760px){.unico-steps{grid-template-columns:repeat(2,minmax(0,1fr))}.unico-step{padding:10px}.step-panel h2{font-size:19px}}
      .kyc-form{max-width:620px;margin:20px auto}.kyc-form .field{margin-bottom:6px}
      .kyc-form input[type=file]{padding:10px}.consent{align-items:flex-start}
      .records{margin-top:28px;border-top:1px solid var(--line);padding-top:18px}
      .records h2{font-size:16px}.record-list{width:100%;border-collapse:collapse;font-size:12px}
      .record-list th,.record-list td{padding:9px 7px;text-align:left;border-bottom:1px solid #353539;word-break:break-word}
      .record-list th{color:#aaa}.record-list button{background:transparent;color:var(--teal);border:0}
      .service-status{margin:12px 0;padding:10px 12px;border-radius:8px;background:#222225;color:#c5c5ca;font-size:12px}
      .service-status.error{color:#ff888e}.service-status.good{color:var(--teal)}
      .form-error{color:#ff888e;margin:10px 0;font-size:12px}
      </style>
  </head>
  <body>
    <div class="topline">
      <span>▣ &nbsp;Deposit</span>
      <div class="right">
        <span>English⌄</span><span>Decimal⌄</span><span>◐</span><span>◉</span>
      </div>
    </div>
    <header class="nav">
      <span class="hamburger">☰</span>
      <div class="brand">MEG<em>W</em>IN</div>
      <div class="navlinks">
        <span class="active">◉ &nbsp;Sports</span><span>◉ &nbsp;Live</span
        ><span>▣ &nbsp;Casino</span><span>▣ &nbsp;Streaming</span
        ><span>▤ &nbsp;My Bets</span>
      </div>
      <div class="nav-right">
        <span class="nav-chip">🎁 Promotion</span
        ><span class="nav-chip">$12,000.88 ⊞</span><span class="avatar">●</span>
      </div>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <div style="width: 100%">
          <div class="menu"><span class="mi">♟</span>My profile</div>
          <div class="menu"><span class="mi">▥</span>Bank</div>
          <div class="menu active">
            <span class="mi">▣</span>KYC Verification
          </div>
          <div class="menu"><span class="mi">◷</span>History</div>
          <div class="menu"><span class="mi">✿</span>Benefits Center</div>
          <div class="menu"><span class="mi">▣</span>Bonus</div>
          <div class="menu"><span class="mi">♟</span>Inbox</div>
        </div>
      </aside>
      <main class="main">
        <section class="kyc" aria-live="polite">
          <div class="split">
            <h1>KYC Verification</h1>
            <span class="badge" id="stateBadge">Not verified</span>
          </div>
          <div id="screen"></div>
          <div class="footer-note" id="footnote">
            MEGWIN · Identity verification powered by Unico (integration design)
          </div>
        </section>
      </main>
    </div>
    <script>
    "use strict";
    const steps = [
      {title:'Prueba de vida',desc:'Unico captura tu rostro y confirma que eres una persona real.'},
      {title:'Verificación de identidad',desc:'Unico valida tus datos de identidad y, si está disponible, consulta CURP / RENAPO.'},
      {title:'Evaluación de riesgo de fraude',desc:'Unico evalúa las señales de riesgo disponibles.'},
      {title:'Captura y reutilización de documentos',desc:'Unico te guía para capturar tu identificación y confirmar tus datos.'}
    ];
    const state={busy:false,recordId:localStorage.getItem('kycRecordId'),records:[],currentRecord:null};
    const screen=document.getElementById('screen'), badge=document.getElementById('stateBadge');
    const esc=(s)=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function progress(active=0){return `<div class="unico-steps" aria-label="Etapas de verificación">${steps.map((s,i)=>`<div class="unico-step ${i<active?'done':i===active?'current':''}"><div class="step-head"><span class="number">${i+1}</span><span>${s.title}</span></div><p>${s.desc}</p></div>`).join('')}</div>`}
    async function api(path,options={}) {
      const response=await fetch(path,{headers:{'Accept':'application/json',...(options.headers||{})},...options});
      const data=await response.json().catch(()=>({}));
      if(!response.ok)throw Error(data.error||`Server error (${response.status})`);
      return data;
    }
    function formatDate(value){return value?new Date(value).toLocaleString():'—'}
    function statusClass(status,result=''){
      if(/FAILED|ERROR/.test(status)||/INVALID_IDENTITY|NOT_APPROVED|ERROR/.test(result))return 'bad';
      if(/APPROVED|_OK$|AUTHENTICATED/.test(result))return 'good';
      return '';
    }
    function renderRecords(){
      const host=document.getElementById('recordRows');
      if(!host)return;
      host.innerHTML=state.records.length?state.records.map(record=>`<tr><td>${esc(record.id)}</td><td class="${statusClass(record.status,record.result)}">${esc(record.status)}</td><td>${esc(record.result||'—')}</td><td>${esc(record.error||'—')}</td><td>${formatDate(record.updatedAt)}</td><td>${record.processId?`<button type="button" data-action="check" data-id="${esc(record.id)}">Consultar</button>`:'—'}</td></tr>`).join(''):'<tr><td colspan="6">Todavía no hay verificaciones registradas.</td></tr>';
    }
    async function loadRecords(){
      const data=await api('/api/kyc/records');
      state.records=data.records||[];
      renderRecords();
    }
    function render(){
      badge.textContent='UAT · Unico';
      badge.className='badge';
      screen.innerHTML=`${progress()}<div class="step-panel"><h2>Paso 1 — Prueba de vida</h2><p>Unico usará la cámara para confirmar que eres una persona real. Después realizará la verificación de identidad, la evaluación de riesgo y la captura de documentos. Al finalizar, podrás revisar y editar el CURP, la fecha de nacimiento y el nombre completo que Unico devuelva.</p><div id="serviceStatus" class="service-status">Comprobando la configuración de Unico…</div><form id="kycForm" class="kyc-form"><label class="checkboxline consent"><input type="checkbox" name="consent" required><span>Autorizo a Unico a procesar la captura biométrica y los datos necesarios para la verificación. Al finalizar, podré revisar y editar los datos de identidad que se devuelvan en KYCTest.</span></label><div id="formError" class="form-error" role="alert"></div><button class="btn btn-main" id="submitButton" type="submit">Iniciar verificación con Unico</button></form><div id="currentRecord"></div><section class="records"><h2>Registros de verificación de KYCTest</h2><div style="overflow-x:auto"><table class="record-list"><thead><tr><th>Registro</th><th>Estado</th><th>Resultado</th><th>Error</th><th>Última actualización</th><th>Acción</th></tr></thead><tbody id="recordRows"></tbody></table></div></section><p class="mode-note">Los datos de identidad se mostrarán cuando Unico finalice el proceso. El estado y el resultado reflejan la respuesta de Unico.</p></div>`;
      renderRecords();
    }
    async function checkConfig(){
      const status=document.getElementById('serviceStatus');
      try{
        const data=await api('/api/kyc/config');
        status.textContent=data.ready?'Unico IDCloud UAT está listo para iniciar el proceso de verificación.':data.message;
        status.className='service-status '+(data.ready?'good':'');
      }catch(err){
        status.textContent=err.message;
        status.className='service-status error';
      }
    }
    async function refreshCurrent(){
      const target=document.getElementById('currentRecord');
      if(!state.recordId)return;
      try{
        const record=await api('/api/kyc/process/'+encodeURIComponent(state.recordId));
        state.currentRecord=record;
        const finished=record.status==='PROCESS_STATE_FINISHED';
        target.innerHTML=`${progress(finished?3:0)}<div class="service-status ${statusClass(record.status,record.result)}">Estado de Unico: <strong>${esc(record.status)}</strong>${record.result?` · Resultado: ${esc(record.result)}`:''}</div>${finished?`<section class="records"><h2>Paso 4 — Captura de documentos y confirmación de datos</h2><p class="muted">Unico devolvió estos datos. Revísalos, corrígelos si es necesario y guárdalos en KYCTest. Los cambios no modifican el resultado original de la verificación de Unico.</p><form id="identityForm" class="kyc-form"><label class="field" for="identityCurp">CURP</label><input class="input curp-input" id="identityCurp" name="curp" maxlength="18" minlength="18" pattern="[A-Za-z0-9]{18}" value="${esc(record.identity?.curp)}" required><label class="field" for="identityBirthDate">Fecha de nacimiento</label><input class="input" id="identityBirthDate" name="birthDate" type="date" value="${esc(record.identity?.birthDate)}" required><label class="field" for="identityFullName">Nombre completo</label><input class="input" id="identityFullName" name="fullName" maxlength="120" value="${esc(record.identity?.fullName)}" required><div id="identityError" class="form-error" role="alert"></div><button class="btn btn-main" type="submit">Guardar cambios</button></form></section>`:''}`;
        await loadRecords();
      }catch(err){
        target.innerHTML=`<div class="service-status error">${esc(err.message)}</div>`;
      }
    }
    screen.addEventListener('submit',async event=>{
      event.preventDefault();
      if(state.busy)return;
      if(event.target.id==='identityForm'){
        state.busy=true;
        const button=event.target.querySelector('button[type="submit"]');
        const error=document.getElementById('identityError');
        button.disabled=true;
        error.textContent='';
        try{
          const form=new FormData(event.target);
          await api('/api/kyc/process/'+encodeURIComponent(state.recordId),{
            method:'PATCH',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({curp:form.get('curp'),birthDate:form.get('birthDate'),fullName:form.get('fullName')})
          });
          await refreshCurrent();
        }catch(err){
          error.textContent=err.message;
        }finally{
          state.busy=false;
          button.disabled=false;
        }
        return;
      }
      if(event.target.id!=='kycForm')return;
      state.busy=true;
      const button=document.getElementById('submitButton');
      const error=document.getElementById('formError');
      button.disabled=true;
      button.textContent='Iniciando…';
      error.textContent='';
      try{
        const data=await api('/api/kyc/process',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({consent:event.target.elements.consent.checked})});
        state.recordId=data.record.id;
        localStorage.setItem('kycRecordId',state.recordId);
        location.assign(data.userRedirectUrl);
      }catch(err){
        error.textContent=err.message;
        button.disabled=false;
        button.textContent='Iniciar verificación con Unico';
        state.busy=false;
        await loadRecords();
      }
    });
    screen.addEventListener('click',async event=>{
      const button=event.target.closest('[data-action="check"]');
      if(!button||state.busy)return;
      state.busy=true;
      button.disabled=true;
      try{
        state.recordId=button.dataset.id;
        localStorage.setItem('kycRecordId',state.recordId);
        await refreshCurrent();
      }finally{
        state.busy=false;
        button.disabled=false;
      }
    });
    render();
    Promise.all([checkConfig(),loadRecords()]).then(refreshCurrent).catch(err=>{
      const status=document.getElementById('serviceStatus');
      status.textContent=err.message;
      status.className='service-status error';
    });
    </script>
  </body>
</html>
