<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ai.bet Casino Front — Dynamic Layout</title>
    <style>
      :root {
        --pink: #ff285f;
        --pink2: #ff587d;
        --bg: #0b0b0d;
        --panel: #171719;
        --panel2: #222225;
        --card: #343437;
        --line: #2d2d31;
        --text: #f7f7f7;
        --muted: #aaaeb6;
        --gold: #ffc94a;
        --sidebar: 224px;
        --header: 58px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, Arial, "Microsoft JhengHei", sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      .topbar {
        height: var(--header);
        position: sticky;
        top: 0;
        z-index: 50;
        background: #111114;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        padding: 0 18px;
        gap: 24px;
      }
      .logo {
        font-size: 26px;
        font-weight: 950;
        font-style: italic;
      }
      .logo b {
        color: var(--pink);
      }
      .topnav {
        display: flex;
        align-items: center;
        gap: 22px;
        min-width: 0;
        overflow-x: auto;
        scrollbar-width: none;
        font-size: 13px;
        font-weight: 800;
      }
      .topnav::-webkit-scrollbar {
        display: none;
      }
      .topnav a {
        flex: 0 0 auto;
        cursor: pointer;
      }
      .topnav a.lobby-nav {
        position: relative;
      }
      .topnav a.lobby-nav.active::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -9px;
        height: 2px;
        border-radius: 999px;
        background: var(--pink);
      }
      .topnav a {
        color: #ddd;
        text-decoration: none;
      }
      .topnav a.active {
        color: var(--pink);
      }
      .top-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .deposit {
        border: 0;
        background: var(--pink);
        color: #fff;
        padding: 9px 16px;
        border-radius: 7px;
        font-weight: 900;
      }
      .balance {
        font-size: 12px;
      }
      .app {
        display: grid;
        grid-template-columns: var(--sidebar) minmax(0, 1fr);
        min-height: calc(100vh - var(--header));
      }
      .sidebar {
        background: #18181a;
        border-right: 1px solid var(--line);
        position: sticky;
        top: var(--header);
        height: calc(100vh - var(--header));
        overflow: auto;
        padding: 14px 9px;
      }
      .side-group-title {
        padding: 13px 10px 7px;
        font-size: 17px;
        font-weight: 950;
        border-top: 1px solid var(--line);
        margin-top: 8px;
      }
      .side-item {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 10px 11px;
        border-radius: 7px;
        color: #d5d5d8;
        font-weight: 760;
        font-size: 14px;
        cursor: pointer;
      }
      .side-item:hover,
      .side-item.active {
        background: #242428;
        color: #fff;
      }
      .side-icon {
        width: 22px;
        text-align: center;
        color: var(--pink);
        font-size: 18px;
      }
      .side-item.vip {
        color: #efc172;
      }
      .side-item.promo {
        color: #ff4e91;
      }
      main {
        min-width: 0;
        padding: 16px 18px 40px;
        max-width: 1600px;
        width: 100%;
        margin: auto;
      }
      .module {
        margin-bottom: 18px;
      }
      .module.hidden {
        display: none;
      }
      .hero {
        height: 190px;
        background: linear-gradient(135deg, #3b3b3f, #252529);
        border-radius: 15px;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hero-slide {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: flex-end;
        padding: 22px;
      }
      .hero-copy {
        background: rgba(0, 0, 0, 0.52);
        backdrop-filter: blur(8px);
        padding: 12px 16px;
        border-radius: 10px;
      }
      .hero-copy b {
        display: block;
        font-size: 22px;
      }
      .hero-copy span {
        color: #ddd;
        font-size: 12px;
      }
      .marquee {
        height: 42px;
        background: #20131a;
        border: 1px solid #4a2030;
        border-radius: 24px;
        display: flex;
        align-items: center;
        overflow: hidden;
      }
      .marquee-icon {
        padding: 0 14px;
        color: var(--pink);
      }
      .marquee-track {
        white-space: nowrap;
        animation: marquee 22s linear infinite;
        color: #f5d8e2;
        font-size: 13px;
      }
      @keyframes marquee {
        from {
          transform: translateX(100%);
        }
        to {
          transform: translateX(-100%);
        }
      }
      .broadcast {
        display: flex;
        gap: 8px;
        overflow: auto;
        padding-bottom: 3px;
      }
      .broadcast-chip {
        flex: 0 0 auto;
        background: #2a1a21;
        border: 1px solid #512637;
        color: #ffd7e2;
        padding: 8px 13px;
        border-radius: 18px;
        font-size: 12px;
      }
      .category-tabs {
        display: flex;
        gap: 9px;
        overflow: auto;
        padding: 3px 0 6px;
        scrollbar-width: none;
      }
      .content-function-block {
        width: 100%;
        overflow: hidden;
      }
      .content-function-block .category-tabs {
        margin: 0;
      }
      .category-tabs::-webkit-scrollbar {
        display: none;
      }
      .category-tab {
        white-space: nowrap;
        background: #1c1c1f;
        border: 1px solid #2c2c30;
        padding: 8px 13px;
        border-radius: 18px;
        color: #c4c4c9;
        font-size: 12px;
      }
      .category-tab.active {
        background: var(--pink);
        color: white;
        border-color: var(--pink);
      }
      .search {
        height: 40px;
        border-radius: 22px;
        background: #222225;
        border: 1px solid #333338;
        color: #aaa;
        display: flex;
        align-items: center;
        padding: 0 15px;
      }
      .search input {
        border: 0;
        outline: 0;
        background: transparent;
        color: #fff;
        width: 100%;
        margin-left: 8px;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 0 10px;
      }
      .section-title {
        font-size: 20px;
        font-weight: 950;
      }
      .view-all {
        font-size: 12px;
        color: #bbb;
        text-decoration: none;
      }
      .game-card {
        position: relative;
        background: #343437;
        border-radius: 9px;
        overflow: hidden;
        min-height: 120px;
        background-size: cover;
        background-position: center;
        isolation: isolate;
      }
      .game-card:before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          transparent 45%,
          rgba(0, 0, 0, 0.72)
        );
        z-index: -1;
      }
      .game-name {
        position: absolute;
        left: 10px;
        right: 48px;
        bottom: 9px;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .favorite {
        position: absolute;
        right: 9px;
        top: 8px;
        font-size: 20px;
        color: #ddd;
      }
      .players {
        position: absolute;
        right: 8px;
        bottom: 7px;
        background: rgba(15, 15, 16, 0.75);
        padding: 4px 7px;
        border-radius: 12px;
        font-size: 10px;
      }
      .rank-number {
        position: absolute;
        left: 8px;
        top: 3px;
        font-size: 54px;
        font-weight: 1000;
        font-style: italic;
        color: #d41020;
        text-shadow: 2px 2px 0 #fff;
      }
      .row-scroll {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(170px, 1fr);
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 5px;
        scroll-snap-type: x proximity;
      }
      .row-scroll > * {
        scroll-snap-align: start;
      }
      .top10 .game-card {
        height: 190px;
      }
      .small-one {
        display: grid;
        grid-template-columns: repeat(4, minmax(150px, 1fr));
        gap: 10px;
      }
      .small-one .game-card {
        height: 170px;
      }
      .one-big {
        display: grid;
        grid-template-columns: minmax(310px, 1.55fr) repeat(
            2,
            minmax(160px, 0.7fr)
          );
        grid-template-rows: repeat(2, 145px);
        gap: 10px;
      }
      .one-big .game-card:first-child {
        grid-row: 1/3;
        height: auto;
      }
      .one-big .game-card:not(:first-child) {
        height: auto;
      }
      .small-two {
        display: grid;
        grid-template-columns: repeat(4, minmax(150px, 1fr));
        gap: 10px;
      }
      .small-two .game-card {
        height: 170px;
      }
      .rank-box {
        background: #141416;
        border-radius: 14px;
        padding: 14px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }
      .rank-list {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .rank-row {
        display: grid;
        grid-template-columns: 44px minmax(120px, 1fr) 110px 150px;
        align-items: center;
        padding: 10px 12px;
        background: #2b1719;
        border-radius: 6px;
      }
      .rank-row:nth-child(1) {
        background: linear-gradient(90deg, #7c6118, #2c2814);
      }
      .rank-row:nth-child(2) {
        background: linear-gradient(90deg, #4b607c, #222832);
      }
      .rank-row:nth-child(3) {
        background: linear-gradient(90deg, #884519, #352218);
      }
      .medal {
        font-size: 25px;
      }
      .rank-meta small {
        display: block;
        color: #bfbfc4;
      }
      .rtp {
        color: #ffc787;
        font-weight: 850;
      }
      .amount {
        font-variant-numeric: tabular-nums;
      }
      .hotcold {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .trend {
        border-radius: 18px;
        padding: 20px;
        overflow: hidden;
      }
      .trend.hot {
        background: linear-gradient(145deg, #941e16, #3a090b);
      }
      .trend.cold {
        background: linear-gradient(145deg, #194e89, #08183b);
      }
      .trend-title {
        font-size: 36px;
        font-weight: 1000;
        font-style: italic;
      }
      .trend-sub {
        margin: 4px 0 14px;
      }
      .trend-item {
        display: grid;
        grid-template-columns: 100px 1fr;
        gap: 15px;
        align-items: center;
        background: rgba(8, 8, 12, 0.45);
        border-radius: 15px;
        padding: 12px;
        margin-top: 8px;
      }
      .trend-thumb {
        height: 86px;
        border-radius: 10px;
        background: #687083;
        background-size: cover;
        background-position: center;
      }
      .trend-game b {
        display: block;
        font-size: 18px;
        margin: 7px 0;
      }
      .trend-rate {
        font-size: 18px;
        font-weight: 900;
      }
      .jackpot {
        background: linear-gradient(105deg, #8b5314, #512100);
        border-radius: 18px;
        padding: 22px;
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
        gap: 24px;
        align-items: center;
        overflow: hidden;
      }
      .jackpot-title {
        font-size: 38px;
        font-weight: 1000;
        font-style: italic;
      }
      .jackpot-visual {
        font-size: 88px;
        text-align: center;
        margin: -25px 0 -8px;
      }
      .jackpot-total {
        background: #241307;
        border: 1px solid #c27a05;
        border-radius: 12px;
        color: #ffe52e;
        font-size: 32px;
        font-weight: 1000;
        padding: 13px;
        text-align: center;
      }
      .jackpot-games {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(180px, 1fr);
        gap: 18px;
        overflow-x: auto;
      }
      .jackpot-game {
        text-align: center;
        font-weight: 800;
      }
      .jackpot-game .game-card {
        height: 170px;
        margin-bottom: 9px;
      }

      .recent-win {
        border: 4px solid #ff4e57;
        border-radius: 12px;
        padding: 12px 14px 14px;
        background: #050505;
        overflow: hidden;
      }
      .recent-win-head {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 22px;
        font-weight: 950;
        margin-bottom: 14px;
      }
      .recent-win-dot {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #08b76a;
        box-shadow: 0 0 0 5px rgba(8, 183, 106, 0.17);
      }
      .recent-win-list {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 96px;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 3px;
        scrollbar-width: none;
      }
      .recent-win-list::-webkit-scrollbar {
        display: none;
      }
      .recent-win-game {
        height: 116px;
        border-radius: 8px;
        background: #28282c center/cover no-repeat;
      }
      .recent-win-user {
        margin-top: 7px;
        color: #a5a5aa;
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .recent-win-amount {
        margin-top: 4px;
        color: #08b76a;
        font-size: 14px;
        font-weight: 900;
      }

      .content-broadcast-wrap {
        position: relative;
        z-index: 25;
        width: 100%;
        height: 0;
        margin: 0;
        padding: 0;
        overflow: visible;
        pointer-events: none;
      }
      .content-broadcast {
        position: absolute;
        left: 50%;
        top: 0;
        transform: translate(-50%, -50%);
        min-width: 360px;
        max-width: min(760px, 92%);
        min-height: 58px;
        padding: 0 30px;
        border-radius: 999px;
        border: 1px solid #9c2450;
        background: linear-gradient(
          100deg,
          #621319 0%,
          #3f1025 52%,
          #29112f 100%
        );
        box-shadow:
          0 8px 24px rgba(0, 0, 0, 0.42),
          inset 0 0 18px rgba(255, 72, 109, 0.08);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 17px;
        color: #fff;
        font-size: 23px;
        font-weight: 760;
        white-space: nowrap;
        overflow: hidden;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 0.28s ease,
          transform 0.28s ease,
          visibility 0.28s ease;
      }
      .content-broadcast.is-hidden {
        opacity: 0;
        visibility: hidden;
        transform: translate(-50%, -35%);
      }
      .content-broadcast-icon {
        font-size: 28px;
        flex: none;
      }
      .content-broadcast-text {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .content-broadcast-text strong {
        color: #ffd329;
        font-weight: 950;
      }
      @media (max-width: 720px) {
        .content-broadcast {
          min-width: 0;
          width: 96%;
          min-height: 50px;
          padding: 0 18px;
          gap: 11px;
          font-size: 16px;
        }
        .content-broadcast-icon {
          font-size: 22px;
        }
      }

      .content-broadcast.is-changing .content-broadcast-text,
      .content-broadcast.is-changing .content-broadcast-icon {
        opacity: 0;
        transform: translateY(6px);
      }
      .content-broadcast-text,
      .content-broadcast-icon {
        transition:
          opacity 0.28s ease,
          transform 0.28s ease;
      }

      .providers {
        display: grid;
        grid-template-columns: repeat(7, minmax(110px, 1fr));
        gap: 9px;
      }
      .provider {
        height: 66px;
        background: #fff;
        color: #222;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 950;
        text-align: center;
        padding: 6px;
      }
      .provider img {
        max-width: 100%;
        max-height: 44px;
      }
      .bottom-web {
        background: #161619;
        border-top: 1px solid var(--line);
        margin: 28px -18px -40px;
        padding: 32px 28px 38px;
        display: grid;
        grid-template-columns: 190px minmax(0, 1fr);
        gap: 54px;
        align-items: start;
      }
      .footer-logo {
        align-self: start;
      }
      .footer-menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 34px 54px;
      }
      .footer-col b {
        display: block;
        margin-bottom: 12px;
        font-size: 15px;
        color: #fff;
      }
      .footer-col a {
        display: block;
        color: #a7a7ad;
        text-decoration: none;
        font-size: 12px;
        margin: 8px 0;
        transition: color 0.15s ease;
      }
      .footer-col a:hover {
        color: #fff;
      }
      .footer-col .footer-parent-link {
        color: #fff;
        font-weight: 800;
        font-size: 15px;
        margin: 0 0 12px;
      }
      .footer-empty {
        color: #777;
        font-size: 12px;
      }
      .h5-bottom {
        display: none;
      }
      .empty-layout {
        border: 1px dashed #444;
        border-radius: 10px;
        padding: 25px;
        text-align: center;
        color: #888;
      }
      .debug-badge {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 70;
        background: #17171a;
        border: 1px solid #39393e;
        padding: 7px 10px;
        border-radius: 8px;
        color: #aaa;
        font-size: 10px;
      }
      @media (max-width: 1050px) {
        :root {
          --sidebar: 190px;
        }
        .small-one {
          grid-template-columns: repeat(4, 1fr);
        }
        .small-two {
          grid-template-columns: repeat(4, 1fr);
        }
        .providers {
          grid-template-columns: repeat(4, 1fr);
        }
        .rank-box,
        .hotcold {
          grid-template-columns: 1fr;
        }
        .jackpot {
          grid-template-columns: 1fr;
        }
        .bottom-web {
          grid-template-columns: 150px minmax(0, 1fr);
          gap: 30px;
        }
        .footer-menu-grid {
          grid-template-columns: repeat(2, minmax(140px, 1fr));
        }
      }
      @media (max-width: 720px) {
        :root {
          --header: 54px;
        }
        .topnav,
        .balance {
          display: none;
        }
        .app {
          display: block;
        }
        .sidebar {
          display: none;
        }
        main {
          padding: 10px 10px 76px;
        }
        .hero {
          height: 130px;
        }
        .section-title {
          font-size: 17px;
        }
        .one-big {
          grid-template-columns: repeat(2, 1fr);
          grid-template-rows: 190px repeat(2, 125px);
        }
        .one-big .game-card:first-child {
          grid-column: 1/3;
          grid-row: auto;
        }
        .small-one,
        .small-two {
          grid-template-columns: repeat(2, 1fr);
        }
        .small-one .game-card,
        .small-two .game-card {
          height: 125px;
        }
        .rank-row {
          grid-template-columns: 34px 1fr 78px;
        }
        .rank-row .amount {
          display: none;
        }
        .trend-item {
          grid-template-columns: 82px 1fr;
        }
        .trend-thumb {
          height: 74px;
        }
        .jackpot {
          padding: 16px;
        }
        .jackpot-games {
          grid-auto-columns: 145px;
        }
        .providers {
          grid-template-columns: repeat(3, 1fr);
        }
        .bottom-web {
          display: none;
        }
        .h5-bottom {
          position: fixed;
          display: flex;
          left: 0;
          right: 0;
          bottom: 0;
          height: 62px;
          background: #17171a;
          border-top: 1px solid #34343a;
          z-index: 60;
          align-items: center;
          justify-content: space-around;
        }
        .h5-item {
          font-size: 11px;
          text-align: center;
          color: #bbb;
          text-decoration: none;
        }
        .h5-item span {
          display: block;
          font-size: 20px;
          margin-bottom: 3px;
        }
        .debug-badge {
          bottom: 70px;
        }
      }
    
      .view-all {
        font-size: 12px;
        color: #bbb;
        text-decoration: none;
        cursor: pointer;
      }
      .view-all-page {
        min-height: calc(100vh - var(--header) - 32px);
      }
      .view-all-hero {
        min-height: 84px;
        border-radius: 10px;
        padding: 20px 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        background:
          linear-gradient(90deg, #101a3a 0%, #111a35 58%, #271335 100%);
        border: 1px solid #202b50;
        overflow: hidden;
      }
      .view-all-title {
        margin: 0;
        font-size: 24px;
        font-weight: 950;
      }
      .view-all-back {
        border: 1px solid #3a3a40;
        background: #202024;
        color: #fff;
        min-height: 36px;
        padding: 0 14px;
        border-radius: 7px;
        font-weight: 850;

            return renderSmallTwo(row, games);
          }

          // 4小1排 / 4 Small 1 Row
          return renderSmallOne(row, games);
        }

        function allContentRows() {
          const rows = [];
          (state.modules || [])
            .filter((m) => enabled(m) && m.module === "content")
            .forEach((m) => rows.push(...moduleRows(m)));
          return rows.filter((row) => {
            const s = normalizeLayoutStyle(styleOf(row));
            return !s.includes("broadcast");
          });
        }

        function findViewAllRow(key) {
          return allContentRows().find(
            (row) => viewAllRowKey(row) === String(key)
          );
        }

        function gameIdentity(game) {
          return String(
            game?.code ||
              game?.gameCode ||
              game?.id ||
              game?.gameId ||
              game?.name ||
              game?.gameName ||
              ""
          );
        }

        function resolveTagGame(item) {
          if (!item) return null;
          if (typeof item === "object") {
            // Game Tags may store the full game object or a relation row.
            const nested = item.game || item.gameInfo || item.data;
            if (nested && typeof nested === "object") return nested;

            const key = gameIdentity(item);
            return (
              allGames.find((game) => gameIdentity(game) === key) || item
            );
          }

          return allGames.find(
            (game) =>
              String(game.id || game.gameId) === String(item) ||
              String(game.code || game.gameCode) === String(item)
          );
        }

        function gamesForViewAll(row) {
          const tag = tagByRow(row);
          const src = tag && (tag.games || tag.gameList || tag.gameIds);
          const dbOrder = new Map(
            allGames.map((game, index) => [gameIdentity(game), index])
          );

          if (Array.isArray(src) && src.length) {
            return src
              .map((item, sourceIndex) => {
                const game = resolveTagGame(item);
                if (!game || !enabled(game)) return null;

                const rawSort =
                  typeof item === "object"
                    ? item.sort ?? item.gameSort ?? item.tagSort
                    : null;
                const sort = Number(rawSort);
                const hasSort = Number.isInteger(sort) && sort > 0;
                const dbIndex = dbOrder.has(gameIdentity(game))
                  ? dbOrder.get(gameIdentity(game))
                  : Number.MAX_SAFE_INTEGER;

                return { game, sourceIndex, dbIndex, sort, hasSort };
              })
              .filter(Boolean)
              .sort((a, b) => {
                // Game Tags Sort has priority. Games without Sort keep DB order.
                if (a.hasSort && b.hasSort) {
                  return a.sort - b.sort || a.sourceIndex - b.sourceIndex;
                }
                if (a.hasSort !== b.hasSort) return a.hasSort ? -1 : 1;
                return a.dbIndex - b.dbIndex || a.sourceIndex - b.sourceIndex;
              })
              .map((item) => item.game);
          }

          const needle = String(row.tags || row.name || "")
            .trim()
            .toLowerCase();

          const matches = allGames.filter((game) => {
            const values = [
              game.tags,
              game.tagName,
              game.name,
              game.gameName,
              game.vendor,
              game.provider,
              game.gameType,
              game.type,
              game.category,
            ]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();

            return needle && values.includes(needle);
          });

          // No Game Tags sort relation: preserve the DB/allGames order.
          return matches.length ? matches : allGames.slice();
        }

        function openViewAll(row) {
          if (!row) return;
          const games = gamesForViewAll(row);
          viewAllState = {
            active: true,
            row,
            title: row.name || row.tags || "All Games",
            games,
            visibleCount: Math.min(VIEW_ALL_PAGE_SIZE, games.length),
            search: "",
            providers: [],
            gameTypes: [],
          };
          renderViewAllPage();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function viewAllGameName(game) {
          return String(game?.name || game?.gameName || "").trim();
        }

        function viewAllProvider(game) {
          // Casino List Provider is based on GameList.Vendor.
          return String(game?.vendor || "").trim();
        }

        function viewAllGameType(game) {
          return String(
            game?.gameType || game?.type || game?.category || ""
          ).trim();
        }

        function countViewAllValues(games, getter) {
          const counts = new Map();
          (games || []).forEach((game) => {
            const value = getter(game);
            if (!value) return;
            counts.set(value, (counts.get(value) || 0) + 1);
          });
          return [...counts.entries()]
            .map(([value, count]) => ({ value, count }))
            .sort((a, b) => a.value.localeCompare(b.value));
        }

        function filteredViewAllGames() {
          const search = String(viewAllState.search || "").trim().toLowerCase();
          const providers = new Set(viewAllState.providers || []);
          const gameTypes = new Set(viewAllState.gameTypes || []);

          return (viewAllState.games || []).filter((game) => {
            const nameOk =
              !search || viewAllGameName(game).toLowerCase().includes(search);
            const providerOk =
              !providers.size || providers.has(viewAllProvider(game));
            const gameTypeOk =
              !gameTypes.size || gameTypes.has(viewAllGameType(game));
            return nameOk && providerOk && gameTypeOk;
          });
        }

        function viewAllMultiFilter(id, label, options, selected) {
          const selectedSet = new Set(selected || []);
          const buttonLabel = selectedSet.size
            ? `${label} (${selectedSet.size})`
            : label;

          return `<div class="view-all-multi" data-view-all-multi="${esc(id)}">
            <button class="view-all-multi-btn" type="button" data-view-all-multi-toggle="${esc(id)}">${esc(buttonLabel)}</button>
            <div class="view-all-multi-menu">
              ${
                options.length
                  ? options.map((option) => `
                    <label class="view-all-option">
                      <input
                        type="checkbox"
                        data-view-all-filter="${esc(id)}"
                        value="${esc(option.value)}"
                        ${selectedSet.has(option.value) ? "checked" : ""}
                      >
                      <span>${esc(option.value)} (${option.count})</span>
                    </label>
                  `).join("")
                  : `<div class="view-all-option">No options</div>`
              }
            </div>
          </div>`;
        }

        function casinoListConfigForLobby() {
          const root = read(CASINO_LIST_KEY, null);
          if (!root || !root.lobbies) return null;
          return root.lobbies[String(selectedLobbyId)] || null;
        }

        function casinoListModules(config) {
          const modules = Array.isArray(config?.modules)
            ? config.modules
                .filter(enabled)
                .slice()
                .sort((a, b) => (+a.sort || 0) - (+b.sort || 0))
            : [];

          // Keep the page usable before Casino List is configured in Admin.
          return modules.length
            ? modules
            : [
                {
                  id: "frontend-game-list-fallback",
                  type: "game",
                  module: "Game List",
                  title: viewAllState.title || "Game List",
                  sort: 1,
                  on: true,
                },
              ];
        }

        function casinoListModuleRows(config, module) {
          const rows = config?.data?.[String(module.id)];
          return sortRows(Array.isArray(rows) ? rows : []);
        }

        let casinoListBannerTimer = null;
        const CASINO_LIST_BANNER_INTERVAL = 5000;

        function renderCasinoListBannerModule(module, config) {
          // Banner Configuration may contain multiple rows, but the List page
          // always occupies only ONE banner position. Rows rotate by Sort.
          const rows = casinoListModuleRows(config, module);
          if (!rows.length) return "";

          const slides = rows.map((row, index) => {
            const image = row.image || row.imageUrl || row.banner || "";
            const title = row.name || module.title || "Casino Banner";
            const subtitle = row.remark || row.description || "";
            const link = row.link || row.route || "";
            return `<div class="casino-list-banner-slide ${index === 0 ? "active" : ""}" data-list-banner-index="${index}" ${link ? `data-list-banner-link="${esc(link)}"` : ""}>
              <div class="hero-slide" ${image ? `style="background-image:url('${esc(image)}')"` : ""}>
                <div class="hero-copy">
                  <b>${esc(title)}</b>
                  ${subtitle ? `<span>${esc(subtitle)}</span>` : ""}
                </div>
              </div>
            </div>`;
          }).join("");

          const controls = rows.length > 1
            ? `<button class="casino-list-banner-control casino-list-banner-prev" type="button" data-list-banner-prev aria-label="Previous banner">‹</button>
               <button class="casino-list-banner-control casino-list-banner-next" type="button" data-list-banner-next aria-label="Next banner">›</button>
               <div class="casino-list-banner-dots">${rows.map((_, index) => `<button class="casino-list-banner-dot ${index === 0 ? "active" : ""}" type="button" data-list-banner-dot="${index}" aria-label="Banner ${index + 1}"></button>`).join("")}</div>`
            : "";

          return `<section class="module hero casino-list-banner" data-list-banner-carousel data-banner-count="${rows.length}">
            ${slides}
            ${controls}
          </section>`;
        }

        function setCasinoListBannerSlide(index, restartTimer = true) {
          const carousel = document.querySelector("[data-list-banner-carousel]");
          if (!carousel) return;
          const slides = [...carousel.querySelectorAll("[data-list-banner-index]")];
          if (!slides.length) return;
          const next = ((Number(index) || 0) % slides.length + slides.length) % slides.length;
          carousel.dataset.activeIndex = String(next);
          slides.forEach((slide, i) => slide.classList.toggle("active", i === next));
          carousel.querySelectorAll("[data-list-banner-dot]").forEach((dot, i) => dot.classList.toggle("active", i === next));
          if (restartTimer) startCasinoListBannerCarousel();
        }

        function startCasinoListBannerCarousel() {
          if (casinoListBannerTimer) clearInterval(casinoListBannerTimer);
          casinoListBannerTimer = null;
          const carousel = document.querySelector("[data-list-banner-carousel]");
          if (!carousel) return;
          const count = Number(carousel.dataset.bannerCount || 0);
          if (count <= 1) return;
          casinoListBannerTimer = setInterval(() => {
            const current = Number(carousel.dataset.activeIndex || 0);
            setCasinoListBannerSlide(current + 1, false);
          }, CASINO_LIST_BANNER_INTERVAL);
        }

        function renderCasinoListProviderModule(module, config) {
          const rows = casinoListModuleRows(config, module);
          if (!rows.length) return "";

          return `<section class="module casino-list-provider-module">
            <div class="section-head">
              <div class="section-title">${esc(module.title || module.name || "Providers")}</div>
            </div>
            <div class="providers">
              ${rows
                .map(
                  (row) => `<div class="provider" title="${esc(row.name || row.vendor || "Provider")}">
                    ${
                      row.image
                        ? `<img src="${esc(row.image)}" alt="${esc(row.name || row.vendor || "Provider")}">`
                        : esc(row.name || row.vendor || "Provider")
                    }
                  </div>`
                )
                .join("")}
            </div>
          </section>`;
        }

        function renderCasinoListGameModule(module) {
          const sourceGames = viewAllState.games || [];
          const providerOptions = countViewAllValues(
            sourceGames,
            viewAllProvider
          );
          const gameTypeOptions = countViewAllValues(
            sourceGames,
            viewAllGameType
          );
          const games = filteredViewAllGames();
          const visible = games.slice(0, viewAllState.visibleCount);
          const total = games.length;
          const sourceTotal = sourceGames.length;
          const shown = visible.length;
          const percent = total ? Math.min(100, (shown / total) * 100) : 0;
          const lobbyName =
            allLobbies.find(
              (lobby) => String(lobby.id) === String(selectedLobbyId)
            )?.name || "Casino";
          const title = viewAllState.title || module.title || "Game List";

          return `<section class="casino-list-game-module">
            <div class="view-all-hero">
              <h1 class="view-all-title">${esc(title)}</h1>
              <button class="view-all-back" id="viewAllBackBtn" type="button">← Back</button>
            </div>

            <div class="view-all-breadcrumb" aria-label="Map">
              <span>${esc(lobbyName)}</span>
              <span>›</span>
              <span>${esc(title)}</span>
            </div>

            <div class="view-all-filter-bar">
              <label class="view-all-search-box">
                <span>⌕</span>
                <input
                  id="viewAllGameSearch"
                  type="search"
                  autocomplete="off"
                  placeholder="Search games"
                  value="${esc(viewAllState.search || "")}"
                >
              </label>
              ${viewAllMultiFilter(
                "provider",
                "Provider",
                providerOptions,
                viewAllState.providers
              )}
              ${viewAllMultiFilter(
                "gameType",
                "Game Type",
                gameTypeOptions,
                viewAllState.gameTypes
              )}
            </div>

            <div class="view-all-filter-count">
              ${
                total === sourceTotal
                  ? `${sourceTotal} games`
                  : `${total} of ${sourceTotal} games matched`
              }
            </div>

            ${
              visible.length
                ? `<div class="view-all-grid">${visible
                    .map((game) => gameCard(game))
                    .join("")}</div>`
                : `<div class="view-all-empty">No games available.</div>`
            }

            ${
              total
                ? `<div class="view-all-footer">
                    <div class="view-all-progress">
                      <div class="view-all-progress-line">
                        <div class="view-all-progress-bar" style="width:${percent}%"></div>
                      </div>
                      <div>Displaying ${shown} of ${total} games</div>
                    </div>
                    ${
                      shown < total
                        ? `<button class="load-more-btn" id="viewAllLoadMoreBtn" type="button">More</button>`
                        : ""
                    }
                  </div>`
                : ""
            }
          </section>`;
        }

        function renderH5ListSearchPage() {
          const homepage = document.getElementById("homepage");
          if (!homepage || !viewAllState.active) return;

          setH5SearchMode(true);
          document.body.classList.add("casino-list-view");

          const query = String(viewAllState.search || "").trim().toLowerCase();
          const sourceGames = viewAllState.games || [];
          const matched = sourceGames.filter((game) =>
            !query || viewAllGameName(game).toLowerCase().includes(query)
          );

          homepage.innerHTML = `<section class="h5-list-search-page">
            <div class="h5-list-search-head">
              <button class="h5-list-search-back" id="h5ListSearchBackBtn" type="button" aria-label="Back">←</button>
              <label class="h5-list-search-input-wrap">
                <span>⌕</span>
                <input id="h5ListSearchInput" type="search" autocomplete="off" placeholder="Search games" value="${esc(viewAllState.search || "")}">
              </label>
            </div>
            <h1 class="h5-list-search-title">Search Games</h1>
            <div class="h5-list-search-count">${query ? `${matched.length} game${matched.length === 1 ? "" : "s"} found` : `${sourceGames.length} games in current list`}</div>
            ${matched.length ? `<div class="view-all-grid">${matched.map((game) => gameCard(game)).join("")}</div>` : `<div class="view-all-empty">No matching games.</div>`}
          </section>`;

          requestAnimationFrame(() => {
            const input = document.getElementById("h5ListSearchInput");
            if (!input) return;
            input.focus();
            const len = input.value.length;
            input.setSelectionRange(len, len);
          });
        }

        function renderViewAllPage() {
          const homepage = document.getElementById("homepage");
          if (!homepage || !viewAllState.active) return;

          setH5SearchMode(false);
          document.body.classList.add("casino-list-view");

          const config = casinoListConfigForLobby();
          const modules = casinoListModules(config);
          let html = "";

          modules.forEach((module) => {
            const type = String(module.type || module.module || "").toLowerCase();
            if (type === "game" || type === "game list") {
              html += renderCasinoListGameModule(module);
            } else if (type === "banner") {
              html += renderCasinoListBannerModule(module, config);
            } else if (
              type === "providerlogo" ||
              type === "provider logo"
            ) {
              html += renderCasinoListProviderModule(module, config);
            }
          });

          // Legacy/malformed config safety: Game List must remain visible.
          const hasGameList = modules.some((module) => {
            const type = String(module.type || module.module || "").toLowerCase();
            return type === "game" || type === "game list";
          });
          if (!hasGameList) {
            html += renderCasinoListGameModule({ title: viewAllState.title });
          }

          homepage.innerHTML = `<section class="view-all-page casino-list-page">${html}</section>`;
          startCasinoListBannerCarousel();
        }

        document.addEventListener("click", (event) => {
          if (event.target.closest("#h5ListSearchBtn")) {
            if (!viewAllState.active) return;
            viewAllState.search = "";
            renderH5ListSearchPage();
            return;
          }

          if (event.target.closest("#h5ListSearchBackBtn")) {
            viewAllState.search = "";
            setH5SearchMode(false);
            renderViewAllPage();
            return;
          }

          const bannerPrev = event.target.closest("[data-list-banner-prev]");
          if (bannerPrev) {
            event.preventDefault();
            event.stopPropagation();
            const carousel = bannerPrev.closest("[data-list-banner-carousel]");
            const current = Number(carousel?.dataset.activeIndex || 0);
            setCasinoListBannerSlide(current - 1);
            return;
          }

          const bannerNext = event.target.closest("[data-list-banner-next]");
          if (bannerNext) {
            event.preventDefault();
            event.stopPropagation();
            const carousel = bannerNext.closest("[data-list-banner-carousel]");
            const current = Number(carousel?.dataset.activeIndex || 0);
            setCasinoListBannerSlide(current + 1);
            return;
          }

          const bannerDot = event.target.closest("[data-list-banner-dot]");
          if (bannerDot) {
            event.preventDefault();
            event.stopPropagation();
            setCasinoListBannerSlide(Number(bannerDot.dataset.listBannerDot || 0));
            return;
          }

          const listBanner = event.target.closest("[data-list-banner-link]");
          if (listBanner) {
            const link = listBanner.dataset.listBannerLink;
            if (link && link !== "#") window.location.href = link;
            return;
          }

          const playButton = event.target.closest("[data-game-play]");
          if (playButton) {
            event.preventDefault();
            event.stopPropagation();
            const game = gameByKey(playButton.dataset.gamePlay);
            if (!game) {
              console.warn("Game data not found for Play:", playButton.dataset.gamePlay);
              return;
            }
            openGameDetail(game, viewAllState.active);
            return;
          }

          if (event.target.closest("#gameDetailBackBtn")) {
            closeGameDetail();
            return;
          }

          if (event.target.closest("#gameCollapseBtn")) {
            gameDetailState.collapsed = !gameDetailState.collapsed;
            renderGameDetailPage();
            return;
          }

          const statHead = event.target.closest(".detail-statistics-head");
          if (statHead) {
            const box = statHead.closest(".detail-statistics");
            if (box) box.classList.toggle("collapsed");
            return;
          }

          const statTab = event.target.closest("[data-detail-stat-tab]");
          if (statTab) {
            const target = statTab.dataset.detailStatTab;
            const box = statTab.closest(".detail-statistics");
            if (box) {
              box.querySelectorAll("[data-detail-stat-tab]").forEach((el)=>el.classList.toggle("active", el===statTab));
              box.querySelectorAll("[data-detail-stat-pane]").forEach((el)=>el.classList.toggle("active", el.dataset.detailStatPane===target));
            }
            return;
          }

          const detailBannerDot = event.target.closest("[data-detail-banner-dot]");
          if (detailBannerDot) {
            const box = detailBannerDot.closest("[data-detail-banner-carousel]");
            const index = Number(detailBannerDot.dataset.detailBannerDot || 0);
            if (box) {
              box.querySelectorAll("[data-detail-banner-index]").forEach((el,i)=>el.classList.toggle("active", i===index));
              box.querySelectorAll("[data-detail-banner-dot]").forEach((el,i)=>el.classList.toggle("active", i===index));
            }
            return;
          }

          const viewAll = event.target.closest("[data-view-all-key]");
          if (viewAll) {
            event.preventDefault();
            const row = findViewAllRow(viewAll.dataset.viewAllKey);
            openViewAll(row);
            return;
          }

          const multiToggle = event.target.closest(
            "[data-view-all-multi-toggle]"
          );
          if (multiToggle) {
            event.preventDefault();
            const id = multiToggle.dataset.viewAllMultiToggle;
            document
              .querySelectorAll(".view-all-multi")
              .forEach((box) => {
                if (box.dataset.viewAllMulti === id) {
                  box.classList.toggle("open");
                } else {
                  box.classList.remove("open");
                }
              });
            return;
          }

          if (
            viewAllState.active &&
            !event.target.closest(".view-all-multi")
          ) {
            document
              .querySelectorAll(".view-all-multi.open")
              .forEach((box) => box.classList.remove("open"));
          }

          if (event.target.closest("#viewAllBackBtn")) {
            resetViewAllState();
            render();
            return;
          }

          if (event.target.closest("#viewAllLoadMoreBtn")) {
            viewAllState.visibleCount = Math.min(
              viewAllState.visibleCount + VIEW_ALL_PAGE_SIZE,
              filteredViewAllGames().length
            );
            renderViewAllPage();
          }
        });

        document.addEventListener("input", (event) => {
          if (!viewAllState.active) return;

          if (event.target.id === "h5ListSearchInput") {
            viewAllState.search = event.target.value || "";
            renderH5ListSearchPage();
            return;
          }

          if (event.target.id !== "viewAllGameSearch") return;

          viewAllState.search = event.target.value || "";
          viewAllState.visibleCount = VIEW_ALL_PAGE_SIZE;
          renderViewAllPage();

          const searchInput = document.getElementById("viewAllGameSearch");
          if (searchInput) {
            searchInput.focus();
            const len = searchInput.value.length;
            searchInput.setSelectionRange(len, len);
          }
        });

        document.addEventListener("change", (event) => {
          if (!viewAllState.active) return;
          const checkbox = event.target.closest("[data-view-all-filter]");
          if (!checkbox) return;

          const key =
            checkbox.dataset.viewAllFilter === "provider"
              ? "providers"
              : "gameTypes";

          const selected = [...document.querySelectorAll(
            `[data-view-all-filter="${checkbox.dataset.viewAllFilter}"]:checked`
          )].map((input) => input.value);

          viewAllState[key] = selected;
          viewAllState.visibleCount = VIEW_ALL_PAGE_SIZE;
          renderViewAllPage();

          const menu = document.querySelector(
            `[data-view-all-multi="${checkbox.dataset.viewAllFilter}"]`
          );
          menu?.classList.add("open");
        });

        function renderTopNav() {
          const nav = document.getElementById("topnav");
          if (!nav) return;

          const staticItems = [
            { name: "SPORTS", href: "#sports" },
            { name: "IN-PLAY", href: "#in-play" },
          ];

          const lobbyItems = visibleLobbies.length
            ? visibleLobbies
            : allLobbies.filter((row) => normalizeLobbyStatus(row.status) !== "deleted");

          nav.innerHTML =
            staticItems
              .map(
                (item) =>
                  `<a href="${esc(item.href)}" data-static-nav="1">${esc(item.name)}</a>`,
              )
              .join("") +
            lobbyItems
              .map(
                (lobby) =>
                  `<a class="lobby-nav ${String(lobby.id) === String(selectedLobbyId) ? "active" : ""}" data-lobby-id="${esc(lobby.id)}" title="${esc(lobby.name || "Lobby")}">${esc(lobby.name || "Lobby")}</a>`,
              )
              .join("");

          nav.querySelectorAll(".lobby-nav").forEach((item) => {
            item.addEventListener("click", (event) => {
              event.preventDefault();
              const lobbyId = item.dataset.lobbyId;
              if (String(lobbyId) === String(selectedLobbyId)) return;

              applyLobby(lobbyId);
              render();

              try {
                localStorage.setItem(
                  KEY,
                  JSON.stringify({
                    ...read(KEY, {}),
                    selectedHomepageLobbyId: lobbyId,
                  }),
                );
              } catch (_) {}
            });
          });
        }

        function renderMainMenu() {
          const rows = sortRows(state.data?.mainMenu || fallback.data.mainMenu);
          const icon = (n) => {
            const map = {
              "All Games": "✣",
              Popular: "🔥",
              Favourites: "★",

        function templateToHtml(config, game) {
          const icon = config.icon
            ? `<img src="${esc(config.icon)}" alt="" style="width:30px;height:30px;object-fit:contain;vertical-align:middle">`
            : "📣";

        function startBroadcastRotation() {
          if (broadcastTimer) {
            clearTimeout(broadcastTimer);
            broadcastTimer = null;
          }
          const hosts = [
            ...document.querySelectorAll(
              '[data-broadcast-host="1"] .content-broadcast',
            ),
          ];
          if (!hosts.length) return;

          const configs = broadcastConfigurations();
          if (!configs.length) {
            hosts.forEach((host) => {
              const textEl = host.querySelector(".content-broadcast-text");
              if (textEl) textEl.innerHTML = "No Broadcast Configuration";
            });
            return;
          }

          // Each render starts from Sort 1 and plays every configuration once.
          broadcastConfigIndex = 0;

          const hideHosts = () => {
            hosts.forEach((host) => {
              host.classList.remove("is-changing");
              host.classList.add("is-hidden");
            });
          };

          const showConfig = (config) => {
            const game = gameForBroadcast(config);
            const output = templateToHtml(config, game);

            hosts.forEach((host) => {
              const iconEl = host.querySelector(".content-broadcast-icon");
              const textEl = host.querySelector(".content-broadcast-text");
              host.classList.add("is-changing");
              host.classList.remove("is-hidden");

              setTimeout(() => {
                if (iconEl) iconEl.innerHTML = config.icon ? output.icon : "📣";
                if (textEl)
                  textEl.innerHTML = output.message
                    .replace(output.icon, "")
                    .trim();
                host.classList.remove("is-changing");
              }, 280);
            });
          };

          const playNext = () => {
            // Finished all configured messages: hide and stop, no replay.
            if (broadcastConfigIndex >= configs.length) {
              hideHosts();
              broadcastTimer = null;
              return;
            }

            const config = configs[broadcastConfigIndex++];
            showConfig(config);

            // Display for configured Interval, then disappear for 1 second.
            broadcastTimer = setTimeout(() => {
              hideHosts();
              broadcastTimer = setTimeout(playNext, 1000);
            }, config.interval * 1000);
          };

          playNext();
        }

          const gameKey = String(game?.code || game?.gameCode || game?.id || game?.gameId || "");
          tags.forEach((tag) => {
            const list = tag?.games || tag?.gameList || tag?.gameIds;
            if (!Array.isArray(list)) return;
            const hit = list.some((item) => {
              if (typeof item === "object") {
                return String(item.code || item.gameCode || item.id || item.gameId || "") === gameKey;

              return String(item) === gameKey;
            });
            if (hit && tag?.name) result.push(tag.name);

          return [...new Set(result)].filter(Boolean);

              </div>
            </div>`).join('')}
            ${rows.length>1?`<div class="detail-banner-dots">${rows.map((_,i)=>`<button class="detail-banner-dot ${i===0?'active':''}" type="button" data-detail-banner-dot="${i}"></button>`).join('')}</div>`:''}
          </section>`;
        }

        function providerRowForGame(game) {
          const vendor = String(game?.vendor || game?.provider || "").trim();
          const rows = [];
          (state.modules || [])
            .filter((m) => enabled(m) && m.module === "providerLogo")
            .forEach((m) => rows.push(...moduleRows(m)));
          return rows.find((row) =>
            String(row.vendor || row.name || "").trim().toLowerCase() === vendor.toLowerCase()
          ) || null;
        }

        function detailBannerRow() {
          const module = (state.modules || [])
            .filter((m) => enabled(m) && m.module === "banner")
            .sort((a, b) => (+a.sort || 0) - (+b.sort || 0))[0];
          return module ? moduleRows(module)[0] : null;
        }

        function recommendedGames(game) {
          const vendor = String(game?.vendor || "").trim().toLowerCase();
          const type = String(game?.gameType || game?.type || game?.category || "").trim().toLowerCase();
          const currentKey = String(game?.code || game?.gameCode || game?.id || game?.gameId || "");
          return allGames
            .filter((g) => String(g.code || g.gameCode || g.id || g.gameId || "") !== currentKey)
            .sort((a, b) => {
              const score = (g) => {
                let s = 0;
                if (vendor && String(g.vendor || "").trim().toLowerCase() === vendor) s += 2;
                if (type && String(g.gameType || g.type || g.category || "").trim().toLowerCase() === type) s += 1;
                return s;
              };
              return score(b) - score(a);
            })
            .slice(0, 10);
        }

        function openGameDetail(game, returnToViewAll = false) {
          if (!game) return;
          gameDetailState = { active: true, game, collapsed: false, returnToViewAll: !!returnToViewAll };
          renderGameDetailPage();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function closeGameDetail() {
          const backToViewAll = gameDetailState.returnToViewAll;
          gameDetailState = { active: false, game: null, collapsed: false, returnToViewAll: false };
          if (backToViewAll && viewAllState.active) renderViewAllPage();
          else render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function renderGameDetailPage() {
          const homepage = document.getElementById("homepage");
          const game = gameDetailState.game;
          if (!homepage || !gameDetailState.active || !game) return;

          const lobbyName =
            allLobbies.find((lobby) => String(lobby.id) === String(selectedLobbyId))?.name || "Casino";
          const name = game.name || game.gameName || "Game";
          const vendor = game.vendor || game.provider || "Provider";
          const type = game.gameType || game.type || game.category || "Casino";
          const tagList = gameTags(game);
          const providerRow = providerRowForGame(game);
          const providerName = providerRow?.name || providerRow?.vendor || vendor;
          const providerLogo = providerRow?.image || providerRow?.logo || providerRow?.logoUrl || "";
          const detailConfig = casinoDetailConfigForLobby();
          const banner = detailBannerRow();
          const recommends = recommendedGames(game);
          const gameImage = imageOf(game);

          homepage.innerHTML = `<section class="game-detail-page">
            <div class="game-detail-top">
              <div class="game-detail-breadcrumb">${esc(lobbyName)} › ${esc(type)} › ${esc(name)}</div>
              <button class="game-detail-back" id="gameDetailBackBtn" type="button">← Back</button>
            </div>

            <div class="game-stage-card">
              <div class="game-stage ${gameDetailState.collapsed ? "compact" : ""}">
                ${gameImage ? `<div class="game-stage-bg" style="background-image:url('${esc(gameImage)}')"></div>` : ""}
                <div class="game-stage-placeholder">
                  <div>
                    <h2>${esc(name)}</h2>
                    <p>${esc(vendor)} · ${esc(type)}</p>
                  </div>
                </div>
              </div>
              <div class="game-stage-toolbar">
                <div class="game-stage-title">
                  <b>${esc(name)}</b>
                  <small>${esc(vendor)}</small>
                </div>
                <button class="game-stage-icon-btn" type="button">☆</button>
                <button class="game-stage-icon-btn" type="button">ⓘ</button>
                <button class="game-stage-icon-btn" id="gameCollapseBtn" type="button">${gameDetailState.collapsed ? "↕" : "↥"}</button>
              </div>
            </div>

            ${renderDetailVolatility(detailConfig, game)}
            ${renderDetailGameStatistics(detailConfig, game)}

            <section class="game-detail-section">
              <div class="game-detail-section-head">
                <div class="game-detail-section-title">Recommended Games</div>
                <span class="game-detail-section-link">View All ❯</span>
              </div>
              <div class="game-detail-scroll">${recommends.map((g) => gameCard(g)).join("")}</div>
            </section>

            <section class="game-detail-section">
              <div class="game-detail-section-head"><div class="game-detail-section-title">Game Tags</div></div>
              <div class="game-tags-list">${
                tagList.length
                  ? tagList.map((tag) => `<span class="game-tag-chip">${esc(tag)}</span>`).join("")
                  : `<span class="game-tag-chip">${esc(type)}</span>`
              }</div>
            </section>

            <section class="game-detail-section">
              <div class="game-detail-section-head"><div class="game-detail-section-title">Provider</div></div>
              <div class="game-provider-block">
                <div class="game-provider-logo">${providerLogo ? `<img src="${esc(providerLogo)}" alt="${esc(providerName)}">` : esc(providerName)}</div>
                <div class="game-provider-meta"><b>${esc(providerName)}</b><span>Provider of ${esc(name)}</span></div>
              </div>
            </section>

            ${renderDetailBannerModule(detailConfig)}
          </section>`;
        }

        function render() {
          if (!viewAllState.active) {
            setH5SearchMode(false);
            document.body.classList.remove("casino-list-view");
          }
          renderTopNav();
          renderMainMenu();

          if (gameDetailState.active) {
            renderGameDetailPage();
            return;
          }
          if (viewAllState.active) {
            renderViewAllPage();
            return;
          }
          const modules = (state.modules || [])
            .filter(enabled)
            .slice()
            .sort((a, b) => (+a.sort || 0) - (+b.sort || 0));
          let html = "";
          modules.forEach((m) => {
            switch (m.module) {
              case "banner":
                html += renderBanner(m);
                break;
              case "recentWin":
                html += renderRecentWin(m);
                break;
              case "marquee":
                html += renderMarquee(m);
                break;
              case "broadcastReceiver":
                html += renderBroadcast(m);
                break;
              case "searchBar":
                html += renderSearch(m);
                break;
              case "content":
                html += renderContent(m);
                break;
              case "contentFunction":
                html += renderContentFunction(m);
                break;
              case "providerLogo":
                html += renderProviders(m);
                break;
              case "bottom":
                html += renderBottom(m);
                break;
            }
          });
          if (!html)
            html =
              '<div class="empty-layout">No enabled homepage modules found.</div>';
          document.getElementById("homepage").innerHTML = html;
          updateMockMarquee();
          startBroadcastRotation();
          const activeLobbyName =
            allLobbies.find(
              (lobby) => String(lobby.id) === String(selectedLobbyId),
            )?.name || "Lobby";
          document.getElementById("dataSourceBadge").textContent = usingBackend
            ? `Source: ${activeLobbyName}`
            : `Source: built-in fallback / ${activeLobbyName}`;
          document.querySelectorAll(".side-item").forEach(
            (x) =>
              (x.onclick = () => {
                document
                  .querySelectorAll(".side-item")
                  .forEach((y) => y.classList.remove("active"));
                x.classList.add("active");
              }),
          );
        }
        render();
        window.addEventListener("storage", (e) => {
          if ([KEY, CASINO_LIST_KEY, CASINO_DETAIL_KEY, TAG_KEY, GAME_KEY, LOBBY_KEY].includes(e.key))
            location.reload();
        });
      })();
    </script>
  </body>
</html>
