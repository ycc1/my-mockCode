<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>正式投放後台管理系統</title>
  <style>
    :root {
      --primary: #1677ff;
      --primary-weak: #eaf3ff;
      --nav: #123457;
      --nav-active: #1f73e8;
      --bg: #f5f7fb;
      --card: #ffffff;
      --line: #e5eaf2;
      --text: #1f2a37;
      --muted: #7a8797;
      --danger: #ff4d4f;
      --success: #22c55e;
      --shadow: 0 8px 30px rgba(25, 55, 99, .08);
      --sidebar-width: 248px;
      --sidebar-collapsed-width: 72px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .app {
      display: block;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar-width);
      background: var(--nav);
      color: #fff;
      z-index: 10;
      overflow-x: hidden;
      overflow-y: auto;
      transition: width .22s ease;
    }

    .brand {
      height: 72px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      font-size: 22px;
      font-weight: 700;
      border-bottom: 1px solid rgba(255,255,255,.08);
      white-space: nowrap;
      overflow: hidden;
    }

    .brand-icon {
      min-width: 28px;
      text-align: center;
    }

    .brand-text {
      opacity: 1;
      transition: opacity .15s ease;
    }

    .menu {
      padding: 14px 10px 30px;
    }

    .menu-section {
      margin-bottom: 8px;
    }

    .menu-title,
    .submenu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 9px;
      color: #dbe9f8;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
    }

    .menu-title {
      font-weight: 650;
      cursor: pointer;
    }

    .menu-title:hover,
    .submenu-item:hover {
      background: rgba(255,255,255,.08);
    }

    .menu-icon {
      width: 18px;
      min-width: 18px;
      text-align: center;
      font-size: 16px;
    }

    .menu-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chev {
      margin-left: auto;
      transition: transform .2s ease;
      font-size: 12px;
    }

    .menu-section.open > .menu-title .chev {
      transform: rotate(180deg);
    }

    .submenu {
      padding-left: 12px;
      display: none;
    }

    .menu-section.open > .submenu {
      display: block;
    }

    .submenu-item {
      font-size: 14px;
      cursor: pointer;
      margin: 4px 0;
    }

    .submenu-item.active {
      background: var(--nav-active);
      color: #fff;
    }

    .single-item {
      cursor: pointer;
      margin: 4px 0;
    }

    .main {
      margin-left: var(--sidebar-width);
      min-height: 100vh;
      transition: margin-left .22s ease;
    }

    .topbar {
      height: 66px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .sidebar-toggle {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      display: grid;
      place-items: center;
      color: #41546a;
      font-size: 18px;
    }

    .sidebar-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .topbar-right {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 12px;
      background: #fff;
    }

    .content {
      padding: 20px 24px 40px;
    }

    .breadcrumb {
      color: #7c8da2;
      font-size: 14px;
      margin-bottom: 14px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .card-head {
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .card-body {
      padding: 18px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 14px;
      align-items: end;
    }

    .field {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .input, .select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
      outline: none;
    }

    .btn {
      border-radius: 9px;
      padding: 9px 16px;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .filter-actions {
      display: flex;
      gap: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 12px 10px;
      text-align: left;
      font-size: 14px;
      vertical-align: middle;
    }

    th {
      background: #fafbfd;
      font-weight: 650;
      color: #384658;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #edf4ff;
      color: var(--primary);
    }


    .report-filter-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(210px, 1fr));
      gap: 14px 18px;
      align-items: end;
    }

    .date-range {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .date-range .input {
      min-width: 0;
    }

    .quick-date-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .report-filter-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }

    .report-table-wrap {
      overflow: auto;
      max-height: 520px;
    }

    .report-table {
      min-width: 1900px;
    }

    .report-table th {
      position: sticky;
      top: 0;
      z-index: 2;
      white-space: nowrap;
    }

    .report-table td {
      white-space: nowrap;
    }

    .json-cell {
      width: 280px;
      min-width: 280px;
      max-width: 280px;
      white-space: normal !important;
      word-break: break-all;
      line-height: 1.55;
      color: #44546a;
    }

    .status-success {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 7px;
      color: #22a447;
      background: #effaf2;
      border: 1px solid #ccefd5;
      font-size: 12px;
    }

    .status-failed {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 7px;
      color: #d4380d;
      background: #fff2e8;
      border: 1px solid #ffd8bf;
      font-size: 12px;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 14px 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    .page-btn {
      min-width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
    }

    .page-btn.active {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-weak);
    }

    @media (max-width: 1180px) {
      .report-filter-grid {
        grid-template-columns: repeat(2, minmax(220px, 1fr));
      }
    }


    .api-meta { display:grid; grid-template-columns:repeat(4,minmax(180px,1fr)); gap:14px; }
    .meta-box { border:1px solid var(--line); border-radius:10px; padding:12px 14px; background:#fafbfd; }
    .meta-label { color:var(--muted); font-size:12px; margin-bottom:6px; }
    .meta-value { font-weight:600; word-break:break-all; }
    .api-tabs { display:flex; gap:6px; border-bottom:1px solid var(--line); padding:0 18px; }
    .api-tab { padding:12px 14px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; }
    .api-tab.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:600; }
    .api-tab-panel { display:none; }
    .api-tab-panel.active { display:block; }
    .api-code { background:#0f172a; color:#e2e8f0; border-radius:10px; padding:16px; overflow:auto; font-family:Consolas,Monaco,monospace; font-size:13px; line-height:1.65; white-space:pre; }
    .api-note { padding:12px 14px; border:1px solid #b9d4ff; background:#f6f9ff; border-radius:10px; color:#44546a; line-height:1.6; }
    .required { color:var(--danger); font-weight:700; }
    .section-title { font-weight:700; margin:4px 0 12px; }
    @media (max-width:1000px){ .api-meta { grid-template-columns:repeat(2,1fr); } }


    .toolbar-row {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .action-link {
      border:0;
      background:transparent;
      padding:0;
      color:var(--primary);
      cursor:pointer;
    }

    .action-link.danger { color:var(--danger); }

    .admin-modal-mask {
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.42);
      z-index:60;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .admin-modal {
      width:min(960px,96vw);
      max-height:90vh;
      background:#fff;
      border-radius:14px;
      box-shadow:0 24px 70px rgba(0,0,0,.24);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    .admin-modal-head,
    .admin-modal-foot {
      padding:16px 20px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .admin-modal-foot {
      border-bottom:0;
      border-top:1px solid var(--line);
      justify-content:flex-end;
    }

    .admin-modal-body {
      padding:20px;
      overflow:auto;
    }

    .modal-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px 20px;
    }

    .modal-grid .full { grid-column:1/-1; }

    .textarea {
      width:100%;
      border:1px solid var(--line);
      border-radius:10px;
      padding:10px 12px;
      background:#fff;
      outline:none;
      resize:vertical;
    }

    .multi-select-box {
      border:1px solid var(--line);
      border-radius:10px;
      background:#fff;
      padding:8px 10px;
      min-height:42px;
      display:flex;
      align-items:center;
      gap:6px;
      flex-wrap:wrap;
    }

    .multi-chip {
      display:inline-flex;
      align-items:center;
      gap:5px;
      padding:4px 8px;
      background:var(--primary-weak);
      color:var(--primary);
      border-radius:7px;
      font-size:12px;
    }

    .multi-select-menu {
      margin-top:8px;
      border:1px solid var(--line);
      border-radius:10px;
      padding:8px;
      background:#fff;
      max-height:180px;
      overflow:auto;
    }

    .multi-select-option {
      display:flex;
      gap:8px;
      align-items:center;
      padding:8px 6px;
      border-radius:7px;
    }

    .multi-select-option:hover { background:#f7f9fc; }

    .permission-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin:8px 0 12px;
      padding:12px 14px;
      border:1px solid var(--line);
      border-radius:10px;
      background:#fafbfd;
    }

    .permission-tree {
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 14px;
    }

    .permission-group {
      padding:10px 0;
      border-bottom:1px dashed var(--line);
    }

    .permission-group:last-child { border-bottom:0; }

    .permission-parent {
      display:flex;
      align-items:center;
      gap:9px;
      font-weight:700;
    }

    .permission-child {
      margin-left:28px;
      padding:7px 0;
      display:flex;
      align-items:center;
      gap:9px;
      color:#37475a;
    }

    .role-tags { display:flex; flex-wrap:wrap; gap:6px; }

    @media (max-width:900px) {
      .modal-grid { grid-template-columns:1fr; }
      .modal-grid .full { grid-column:auto; }
    }


    /* ===== Role Management ===== */
    .role-filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 14px;
      align-items: end;
    }

    .role-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .role-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .role-switch {
      width: 46px;
      height: 25px;
      border-radius: 999px;
      background: #cbd5e1;
      position: relative;
      cursor: pointer;
      transition: .2s;
      border: 0;
      padding: 0;
    }

    .role-switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 19px;
      height: 19px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0,0,0,.22);
      transition: .2s;
    }

    .role-switch.on {
      background: var(--primary);
    }

    .role-switch.on::after {
      left: 24px;
    }

    .role-action {
      border: 0;
      background: transparent;
      padding: 4px 7px;
      color: var(--primary);
    }

    .role-action.danger {
      color: var(--danger);
    }

    .role-modal-mask {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, .45);
      padding: 24px;
    }

    .role-modal-mask.show {
      display: flex;
    }

    .role-modal {
      width: min(920px, 96vw);
      max-height: 90vh;
      overflow: hidden;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 24px 70px rgba(0,0,0,.24);
      display: flex;
      flex-direction: column;
    }

    .role-modal-head,
    .role-modal-foot {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .role-modal-foot {
      justify-content: flex-end;
      gap: 10px;
      border-bottom: 0;
      border-top: 1px solid var(--line);
    }

    .role-modal-body {
      padding: 20px;
      overflow: auto;
    }

    .role-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .role-form-grid .full {
      grid-column: 1 / -1;
    }

    .role-multi-select {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      background: #fff;
    }

    .role-tag {
      background: var(--primary-weak);
      color: var(--primary);
      border: 1px solid #cfe2ff;
      border-radius: 7px;
      padding: 4px 8px;
      font-size: 13px;
    }

    .permission-box {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    .permission-head {
      padding: 12px 14px;
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }

    .permission-tree {
      padding: 10px 14px 16px;
    }

    .permission-parent {
      margin-top: 8px;
      padding: 8px 0;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .permission-child {
      margin-left: 28px;
      padding: 7px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .role-empty {
      padding: 34px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .role-filter-grid,
      .role-form-grid {
        grid-template-columns: 1fr;
      }
      .role-form-grid .full {
        grid-column: auto;
      }
    }

    /* ===== 整个 Sidebar 收缩 ===== */
    body.sidebar-collapsed .sidebar {
      width: var(--sidebar-collapsed-width);
    }

    body.sidebar-collapsed .main {
      margin-left: var(--sidebar-collapsed-width);
    }

    body.sidebar-collapsed .brand {
      justify-content: center;
      padding: 0;
    }

    body.sidebar-collapsed .brand-text,
    body.sidebar-collapsed .menu-label,
    body.sidebar-collapsed .chev {
      display: none;
    }

    body.sidebar-collapsed .menu-title,
    body.sidebar-collapsed .submenu-item {
      justify-content: center;
      padding-left: 10px;
      padding-right: 10px;
    }

    body.sidebar-collapsed .submenu {
      display: none !important;
    }

    body.sidebar-collapsed .menu {
      padding-left: 8px;
      padding-right: 8px;
    }

    /* 收缩后 hover 显示文字提示 */
    body.sidebar-collapsed .menu-title,
    body.sidebar-collapsed .single-item {
      position: relative;
      overflow: visible;
    }

    body.sidebar-collapsed .menu-title:hover::after,
    body.sidebar-collapsed .single-item:hover::after {
      content: attr(data-tooltip);
      position: fixed;
      left: 80px;
      margin-top: 0;
      background: #1f2a37;
      color: #fff;
      border-radius: 7px;
      padding: 7px 10px;
      font-size: 13px;
      white-space: nowrap;
      z-index: 100;
      box-shadow: 0 5px 18px rgba(0,0,0,.18);
    }

    @media (max-width: 900px) {
      .sidebar {
        transform: translateX(0);
      }

      body.sidebar-mobile-hidden .sidebar {
        transform: translateX(-100%);
      }

      .main,
      body.sidebar-collapsed .main {
        margin-left: 0;
      }

      .filter-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>
  <section id="app" class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">◆</span>
        <span class="brand-text">正式投放後台管理系統</span>
      </div>

      <nav class="menu">
        <div class="menu-section open">
          <div class="menu-title" data-tooltip="廣告商務配置">
            <span class="menu-icon">◉</span>
            <span class="menu-label">廣告商務配置</span>
            <span class="chev">⌃</span>
          </div>
          <div class="submenu">
            <div class="submenu-item" data-page="advertiser">
              <span class="menu-icon">·</span>
              <span class="menu-label">廣告商務配置</span>
            </div>
            <div class="submenu-item" data-page="eventConfig">
              <span class="menu-icon">·</span>
              <span class="menu-label">事件配置</span>
            </div>
          </div>
        </div>

        <div class="menu-section open">
          <div class="menu-title" data-tooltip="渠道配置">
            <span class="menu-icon">▣</span>
            <span class="menu-label">渠道配置</span>
            <span class="chev">⌃</span>
          </div>
          <div class="submenu">
            <div class="submenu-item active" data-page="channel">
              <span class="menu-icon">·</span>
              <span class="menu-label">渠道配置</span>
            </div>
            <div class="submenu-item" data-page="partner">
              <span class="menu-icon">·</span>
              <span class="menu-label">渠道商配置</span>
            </div>
            <div class="submenu-item" data-page="tracking">
              <span class="menu-icon">·</span>
              <span class="menu-label">廣告鏈結生成</span>
            </div>
          </div>
        </div>

        <div class="menu-section open">
          <div class="menu-title" data-tooltip="廣告配置">
            <span class="menu-icon">▤</span>
            <span class="menu-label">廣告配置</span>
            <span class="chev">⌃</span>
          </div>
          <div class="submenu">
            <div class="submenu-item" data-page="campaign">
              <span class="menu-icon">·</span>
              <span class="menu-label">廣告內容配置</span>
            </div>
          </div>
        </div>

        <div class="menu-section open">
          <div class="menu-title" data-tooltip="報表">
            <span class="menu-icon">▥</span>
            <span class="menu-label">報表</span>
            <span class="chev">⌃</span>
          </div>
          <div class="submenu">
            <div class="submenu-item" data-page="uploadLog">
              <span class="menu-icon">·</span>
              <span class="menu-label">上報日誌</span>
            </div>
            <div class="submenu-item" data-page="settlement">
              <span class="menu-icon">·</span>

    let roleRows = [
      {
        id: 19,
        name: '財務',
        countries: ['Brazil'],
        status: true,
        description: '充值 / 提現',
        permissions: ['報表', '結算報表']
      },
      {
        id: 18,
        name: '外部投放看板權限',
        countries: ['Brazil'],
        status: true,
        description: '推廣日報及推廣鏈接查看',
        permissions: ['渠道配置', '廣告鏈結生成', '報表', '歸因報表']
      },
      {
        id: 17,
        name: '活動投放功能測試',
        countries: ['Mexico'],
        status: true,
        description: '-',
        permissions: ['廣告商務配置', '事件配置', '渠道配置', '廣告配置']
      },
      {
        id: 16,
        name: 'PM',
        countries: ['Global'],
        status: true,
        description: '產品',
        permissions: ['廣告商務配置', '事件配置', '渠道配置', '渠道商配置', '廣告鏈結生成', '廣告配置', '報表', '上報日誌', '結算報表', '歸因報表', '上報規範化回應']
      },
      {
        id: 15,
        name: 'NoPermission',
        countries: ['Global'],
        status: true,
        description: 'no permissions',
        permissions: []
      }
    ];

    const rolePermissionTree = [
      {
        name: '廣告商務配置',
        children: ['廣告商務配置', '事件配置']
      },
      {
        name: '渠道配置',
        children: ['渠道配置', '渠道商配置', '廣告鏈結生成']
      },
      {
        name: '廣告配置',
        children: ['廣告內容配置']
      },
      {
        name: '報表',
        children: ['上報日誌', '結算報表', '歸因報表']
      },
      {
        name: '上報規範化回應',
        children: []
      },
      {
        name: '帳號管理',
        children: []
      },
      {
        name: '角色權限管理',
        children: []
      }
    ];

    let roleEditingId = null;
    let roleQuery = {
      name: '',
      country: ''
    };

    function openRoleManagementPage(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }

      document.querySelectorAll('[data-page]').forEach(node => {
        node.classList.remove('active');
      });

      const roleMenu = document.querySelector('[data-page="role"]');
      if (roleMenu) roleMenu.classList.add('active');

      renderRoleManagement();
    }

    function renderRoleManagement() {
      const keyword = roleQuery.name.trim().toLowerCase();

      const filtered = roleRows.filter(row => {
        const nameOk = !keyword || row.name.toLowerCase().includes(keyword);
        const countryOk = !roleQuery.country || row.countries.includes(roleQuery.country);
        return nameOk && countryOk;
      });

      const tbody = filtered.length
        ? filtered.map(row => `
          <tr>
            <td>${row.id}</td>
            <td>${escapeHtml(row.name)}</td>
            <td>${row.countries.map(c => `<span class="badge" style="margin-right:5px">${escapeHtml(c)}</span>`).join('')}</td>
            <td>
              <span class="role-status">
                <button
                  class="role-switch ${row.status ? 'on' : ''}"
                  title="啟用 / 停用"
                  onclick="toggleRoleStatus(${row.id})"
                ></button>
                <span style="color:${row.status ? '#00a854' : '#94a3b8'}">
                  ${row.status ? '啟用' : '停用'}
                </span>
              </span>
            </td>
            <td>${escapeHtml(row.description || '-')}</td>
            <td>
              <button class="role-action" onclick="openRoleModal(${row.id})">Edit</button>
              <button class="role-action danger" onclick="removeRole(${row.id})">Remove</button>
            </td>
          </tr>
        `).join('')
        : `<tr><td colspan="6"><div class="role-empty">查無角色資料</div></td></tr>`;

      document.getElementById('content').innerHTML = `
        <div class="breadcrumb">角色權限管理 &nbsp;›&nbsp; Role List</div>
        <div class="page-title">角色權限管理</div>

        <div class="card">
          <div class="card-body">
            <div class="role-filter-grid">
              <div class="field">
                <label>Name</label>
                <input id="roleSearchName" class="input" placeholder="Please enter" value="${escapeHtml(roleQuery.name)}">
              </div>

              <div class="field">
                <label>Country</label>
                <select id="roleSearchCountry" class="select">
                  <option value="">Select</option>
                  <option value="Brazil" ${roleQuery.country === 'Brazil' ? 'selected' : ''}>Brazil</option>
                  <option value="Mexico" ${roleQuery.country === 'Mexico' ? 'selected' : ''}>Mexico</option>
                  <option value="Global" ${roleQuery.country === 'Global' ? 'selected' : ''}>Global</option>
                </select>
              </div>

              <div class="filter-actions">
                <button class="btn" onclick="resetRoleQuery()">Reset</button>
                <button class="btn btn-primary" onclick="queryRoles()">Query</button>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <strong style="font-size:18px">Role List</strong>
            <div class="role-toolbar">
              <button class="btn btn-primary" onclick="openRoleModal()">Add Role</button>
            </div>
          </div>

          <div class="card-body" style="padding:0;overflow:auto">
            <table style="min-width:960px">
              <thead>
                <tr>
                  <th style="width:70px">ID</th>
                  <th>Name</th>
                  <th>Country</th>
                  <th>Status</th>
                  <th>Description</th>
                  <th style="width:180px">Actions</th>
                </tr>
              </thead>
              <tbody>${tbody}</tbody>
            </table>
          </div>
        </div>

        <div id="roleModalMask" class="role-modal-mask" onclick="closeRoleModalByMask(event)">
          <div class="role-modal" onclick="event.stopPropagation()">
            <div class="role-modal-head">
              <strong id="roleModalTitle" style="font-size:20px">Add Role</strong>
              <button class="btn" style="padding:5px 10px" onclick="closeRoleModal()">✕</button>
            </div>

            <div id="roleModalBody" class="role-modal-body"></div>

            <div class="role-modal-foot">
              <button class="btn" onclick="closeRoleModal()">Cancel</button>
              <button class="btn btn-primary" onclick="saveRole()">Save</button>
            </div>
          </div>
        </div>
      `;
    }

    function queryRoles() {
      roleQuery.name = document.getElementById('roleSearchName')?.value || '';
      roleQuery.country = document.getElementById('roleSearchCountry')?.value || '';
      renderRoleManagement();
    }

    function resetRoleQuery() {
      roleQuery = { name: '', country: '' };
      renderRoleManagement();
    }

    function toggleRoleStatus(id) {
      const role = roleRows.find(item => item.id === id);
      if (!role) return;
      role.status = !role.status;
      renderRoleManagement();
    }

    function removeRole(id) {
      const role = roleRows.find(item => item.id === id);
      if (!role) return;

      if (!confirm(`確定刪除角色「${role.name}」？`)) return;

      roleRows = roleRows.filter(item => item.id !== id);
      renderRoleManagement();
    }

    function openRoleModal(id = null) {
      roleEditingId = id;

      const role = id
        ? roleRows.find(item => item.id === id)
        : {
            name: '',
            countries: ['Brazil'],
            status: true,
            description: '',
            permissions: []
          };

      if (!role) return;

      const mask = document.getElementById('roleModalMask');
      const title = document.getElementById('roleModalTitle');
      const body = document.getElementById('roleModalBody');

      title.textContent = id ? 'Edit Role' : 'Add Role';

      body.innerHTML = `
        <div class="role-form-grid">
          <div class="field">
            <label>Role Name <span class="required">*</span></label>
            <input id="roleNameInput" class="input" placeholder="Please enter role name" value="${escapeHtml(role.name)}">
          </div>

          <div class="field">
            <label>Country <span class="required">*</span></label>
            <div class="role-multi-select">
              ${['Brazil', 'Mexico', 'Global'].map(country => `
                <label style="display:flex;align-items:center;gap:6px;padding:4px 7px">
                  <input
                    type="checkbox"
                    name="roleCountry"
                    value="${country}"
                    ${role.countries.includes(country) ? 'checked' : ''}
                  >
                  ${country}
                </label>
              `).join('')}
            </div>
          </div>

          <div class="field full">
            <label>Description</label>
            <textarea
              id="roleDescriptionInput"
              class="input"
              rows="4"
              style="resize:vertical"
              placeholder="Please enter description"
            >${escapeHtml(role.description || '')}</textarea>
          </div>
        </div>

        <div class="permission-box">
          <div class="permission-head">
            <strong>功能權限列表（依現行左側功能）</strong>
            <div style="display:flex;gap:8px">
              <button class="btn" onclick="setAllRolePermissions(true)">Select All</button>
              <button class="btn" onclick="setAllRolePermissions(false)">Clear</button>
            </div>
          </div>

          <div class="permission-tree">
            ${rolePermissionTree.map((group, groupIndex) => {
              const parentChecked =
                role.permissions.includes(group.name) ||
                (group.children.length > 0 && group.children.every(child => role.permissions.includes(child)));

              return `
                <div class="permission-parent">
                  <input
                    type="checkbox"
                    class="perm-parent"
                    data-group-index="${groupIndex}"
                    value="${escapeHtml(group.name)}"
                    ${parentChecked ? 'checked' : ''}
                    onchange="togglePermissionGroup(${groupIndex}, this.checked)"
                  >
                  <span>${escapeHtml(group.name)}</span>
                </div>

                ${group.children.map(child => `
                  <label class="permission-child">
                    <input
                      type="checkbox"
                      class="perm-child"
                      data-group-index="${groupIndex}"
                      value="${escapeHtml(child)}"
                      ${role.permissions.includes(child) ? 'checked' : ''}
                      onchange="syncPermissionParent(${groupIndex})"
                    >
                    <span>${escapeHtml(child)}</span>
                  </label>
                `).join('')}
              `;
            }).join('')}
          </div>
        </div>
      `;

      mask.classList.add('show');
    }

    function closeRoleModal() {
      document.getElementById('roleModalMask')?.classList.remove('show');
      roleEditingId = null;
    }

    function closeRoleModalByMask(event) {
      if (event.target.id === 'roleModalMask') {
        closeRoleModal();
      }
    }

    function setAllRolePermissions(checked) {
      document.querySelectorAll('#roleModalBody .perm-parent, #roleModalBody .perm-child')
        .forEach(input => {
          input.checked = checked;
        });
    }

    function togglePermissionGroup(groupIndex, checked) {
      document.querySelectorAll(`#roleModalBody .perm-child[data-group-index="${groupIndex}"]`)
        .forEach(input => {
          input.checked = checked;
        });
    }

    function syncPermissionParent(groupIndex) {
      const parent = document.querySelector(`#roleModalBody .perm-parent[data-group-index="${groupIndex}"]`);
      const children = [...document.querySelectorAll(`#roleModalBody .perm-child[data-group-index="${groupIndex}"]`)];

      if (!parent || !children.length) return;

      parent.checked = children.every(child => child.checked);
      parent.indeterminate = children.some(child => child.checked) && !parent.checked;
    }

    function saveRole() {
      const name = document.getElementById('roleNameInput')?.value.trim() || '';
      const description = document.getElementById('roleDescriptionInput')?.value.trim() || '';

      const countries = [...document.querySelectorAll('input[name="roleCountry"]:checked')]
        .map(input => input.value);

      if (!name) {
        alert('請輸入 Role Name');
        return;
      }

      if (!countries.length) {
        alert('請至少選擇一個 Country');
        return;
      }

      const permissions = [
        ...document.querySelectorAll('#roleModalBody .perm-parent:checked, #roleModalBody .perm-child:checked')
      ].map(input => input.value);

      const uniquePermissions = [...new Set(permissions)];

      if (roleEditingId) {
        const role = roleRows.find(item => item.id === roleEditingId);
        if (!role) return;

        role.name = name;
        role.countries = countries;
        role.description = description;
        role.permissions = uniquePermissions;
      } else {
        const nextId = roleRows.length
          ? Math.max(...roleRows.map(item => item.id)) + 1
          : 1;

        roleRows.unshift({
          id: nextId,
          name,
          countries,
          status: true,
          description,
          permissions: uniquePermissions
        });
      }

      closeRoleModal();
      renderRoleManagement();
    }

    function toggleSidebar() {
      if (window.innerWidth <= 900) {
        document.body.classList.toggle('sidebar-mobile-hidden');
        return;
      }

      document.body.classList.toggle('sidebar-collapsed');

      localStorage.setItem(
        'ad-admin-sidebar-collapsed',
        document.body.classList.contains('sidebar-collapsed') ? '1' : '0'
      );
    }

    function restoreSidebarState() {
      if (
        window.innerWidth > 900 &&
        localStorage.getItem('ad-admin-sidebar-collapsed') === '1'
      ) {
        document.body.classList.add('sidebar-collapsed');
      }
    }

    document.getElementById('sidebarToggle').addEventListener('click', toggleSidebar);


    document.addEventListener('click', event => {
      const apiTab = event.target.closest('[data-api-tab]');
      if (!apiTab) return;
      document.querySelectorAll('.api-tab').forEach(node => node.classList.remove('active'));
      document.querySelectorAll('.api-tab-panel').forEach(node => node.classList.remove('active'));
      apiTab.classList.add('active');
      const panel = document.getElementById(`api-${apiTab.dataset.apiTab}`);
      if (panel) panel.classList.add('active');
    });

    document.addEventListener('click', event => {
      const menuTitle = event.target.closest('.menu-title');

      if (menuTitle) {
        if (document.body.classList.contains('sidebar-collapsed')) {
          document.body.classList.remove('sidebar-collapsed');
          localStorage.setItem('ad-admin-sidebar-collapsed', '0');
        }

        menuTitle.closest('.menu-section').classList.toggle('open');
        return;
      }

      const item = event.target.closest('[data-page]');

      if (!item) return;

      document.querySelectorAll('[data-page]').forEach(node => {
        node.classList.remove('active');
      });

      item.classList.add('active');
      renderPage(item.dataset.page);
    });

    restoreSidebarState();
    renderPage('channel');
  </script>
