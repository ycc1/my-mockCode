<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aibet Admin - PayCode</title>
    <style>
        :root {
            --blue: #2d7fd8;
            --blue-dark: #256ec0;
            --blue-soft: #eef6ff;
            --border: #dfe4ea;
            --text: #111827;
            --muted: #667085;
            --content: #f3f7fd;
            --header-h: 52px;
            --sidebar-w: 260px;
            --shadow: 0 2px 8px rgba(0, 0, 0, .06);
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #f6bd11;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            color: var(--text);
            font-size: 14px;
            background: #fff;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        .topbar {
            height: var(--header-h);
            background: var(--blue);
            color: #fff;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 1px 0 rgba(0, 0, 0, .08);
        }

        .brand {
            width: var(--sidebar-w);
            flex: 0 0 var(--sidebar-w);
            height: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 12px;
        }

        .menu-toggle {
            border: 0;
            background: transparent;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 6px;
        }

        .menu-toggle:hover {
            background: rgba(255, 255, 255, .12);
        }

        .logo {
            font-size: 30px;
            line-height: 1;
            font-style: italic;
            font-weight: 900;
            letter-spacing: -2px;
            color: #fff;
        }

        .tabs {
            height: 40px;
            display: flex;
            align-items: center;
            align-self: center;
            background: rgba(0, 0, 0, .06);
            overflow-x: auto;
            max-width: min(860px, 48vw);
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            height: 100%;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 0 14px;
            background: #2b77cf;
            color: #fff;
            border-left: 1px solid rgba(255, 255, 255, .06);
            cursor: pointer;
            white-space: nowrap;
        }

        .tab.active {
            background: var(--blue-dark);
            font-weight: 800;
        }

        .tab .close {
            width: 18px;
            height: 18px;
            display: grid;
            place-items: center;
            border-radius: 3px;
            font-size: 16px;
            background: rgba(255, 255, 255, .12);
        }

        .top-spacer {
            flex: 1;
        }

        .clock {
            font-size: 13px;
            margin-right: 14px;
            white-space: nowrap;
        }

        .country-context {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-right: 10px;
            padding: 6px 10px;
            border-radius: 7px;
            background: rgba(255, 255, 255, .14);
            font-size: 13px;
            font-weight: 800;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: 10px;
            font-size: 13px;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2b4f87, #9bb5d7);
        }

        .layout {
            display: flex;
            min-height: calc(100vh - var(--header-h));
        }

        .sidebar {
            width: var(--sidebar-w);
            flex: 0 0 var(--sidebar-w);
            background: #fff;
            border-right: 1px solid var(--border);
            overflow-y: auto;
            height: calc(100vh - var(--header-h));
            position: sticky;
            top: var(--header-h);
            transition: .2s width, .2s flex-basis;
        }

        .content {
            flex: 1;
            padding: 16px;
            background: var(--content);
            min-width: 0;
            overflow: auto;
            height: calc(100vh - var(--header-h));
        }

        .menu-section {
            border-bottom: 1px solid var(--border);
        }

        .menu-item {
            height: 44px;
            display: flex;
            align-items: center;
            padding: 0 16px 0 12px;
            gap: 10px;
            cursor: pointer;
            font-weight: 500;
            position: relative;
            background: #fff;
        }

        .menu-item:hover {
            background: #f7fbff;
        }

        .menu-icon {
            width: 22px;
            height: 22px;
            display: grid;
            place-items: center;
            color: var(--blue);
            font-size: 18px;
            flex: 0 0 22px;
        }

        .chev {
            margin-left: auto;
            color: #777;
            transition: .2s transform;
        }

        .menu-section.open > .menu-item .chev {
            transform: rotate(180deg);
        }

        .submenu {
            display: none;
            padding: 4px 0 8px;
            background: #fff;
        }

        .menu-section.open > .submenu {
            display: block;
        }

        .submenu .sub {
            height: 40px;
            display: flex;
            align-items: center;
            padding-left: 38px;
            gap: 10px;
            cursor: pointer;
        }

        .submenu .sub:hover,
        .submenu .sub.active {
            background: var(--blue-soft);
        }

        .submenu .sub.active {
            color: var(--blue);
            font-weight: 800;
            border-left: 3px solid var(--blue);
            padding-left: 35px;
        }

        .nested .sub.active {
            padding-left: 57px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #bfc1c4;
        }

        .sub.active .dot {
            background: var(--blue);
        }

        .sub-label {
            flex: 1;
        }

        .nested {
            display: none;
        }

        .nested.open {
            display: block;
        }

        .nested .sub {
            padding-left: 60px;
        }

        body.collapsed .brand,
        body.collapsed .sidebar {
            width: 56px;
            flex-basis: 56px;
        }

        body.collapsed .logo,
        body.collapsed .menu-label,
        body.collapsed .chev,
        body.collapsed .submenu {
            display: none;
        }

        body.collapsed .menu-item {
            justify-content: center;
            padding: 0;
        }

        .breadcrumb {
            font-size: 12px;
            color: #777;
            margin-bottom: 10px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 900;
            margin: 0 0 12px;
        }

        .panel,
        .filter-box {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .filter-box {
            padding: 14px;
            margin-bottom: 12px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(170px, 1fr));
            gap: 12px;
        }

        .form-field label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            color: #344054;
            margin-bottom: 5px;
        }

        .form-field input,
        .form-field select {
            width: 100%;
            height: 36px;
            border: 1px solid #d6deeb;
            border-radius: 6px;
            padding: 0 10px;
            background: #fff;
        }

        .action-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn {
            border: 0;
            border-radius: 5px;
            padding: 8px 14px;
            color: #fff;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            background: var(--blue);
        }

        .btn:hover {
            filter: brightness(.97);
        }

        .btn.reset {
            background: var(--warning);
            color: #111;
        }

        .btn.gray {
            background: #7e8795;
        }

        .btn.light {
            background: #fff;
            color: #111;
            border: 1px solid #d6deeb;
        }

        .btn.danger {
            background: var(--danger);
        }

        .panel {
            overflow: hidden;
        }

        .panel-head {
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
        }

        .panel-head h2 {
            margin: 0;
            font-size: 17px;
        }

        .table-wrap {
            overflow: auto;
        }

        .table {
            width: 100%;
            min-width: 1450px;
            border-collapse: collapse;
            background: #fff;
            font-size: 13px;
        }

        .table th,
        .table td {
            border-bottom: 1px solid #edf0f3;
            text-align: left;
            padding: 10px 12px;
            white-space: nowrap;
            vertical-align: middle;
        }

        .table th {
            background: #f8fbff;
            color: #344054;
            font-weight: 900;
        }

        .table tr:hover td {
            background: #fbfdff;
        }

        .status-switch {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .status-switch input {
            display: none;
        }

        .status-slider {
            width: 42px;
            height: 22px;
            border-radius: 999px;
            background: #c7d0dd;
            position: relative;
            transition: .2s;
        }

        .status-slider::before {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            left: 2px;
            top: 2px;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
            transition: .2s;
        }

        .status-switch input:checked + .status-slider {
            background: var(--blue);
        }

        .status-switch input:checked + .status-slider::before {
            left: 22px;
        }

        .status-switch-text {
            min-width: 42px;
            font-size: 12px;
            font-weight: 900;
            color: #667085;
        }

        .status-switch input:checked ~ .status-switch-text {
            color: var(--success);
        }

        .link-action {
            border: 0;
            background: transparent;
            color: #1677ff;
            cursor: pointer;
            padding: 0 7px;
        }

        .link-action.remove {
            color: #ef4444;
        }

        .empty {
            text-align: center !important;
            color: #98a2b3;
            padding: 24px !important;
        }

        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .48);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        /* Confirmation dialog must stack above the KYC edit dialog. */
        #confirmMask { z-index: 420; }
        #confirmMask .modal { width: min(560px, 100%) !important; }
        #confirmMessage { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.65; }

        .modal-mask.open {
            display: flex;
        }

        .modal {
            width: min(720px, 100%);
            max-height: 90vh;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-head {
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid var(--border);
            background: #fbfdff;
        }

        .modal-head h3 {
            margin: 0;
            font-size: 18px;
        }

        .modal-close {
            border: 0;
            background: transparent;
            font-size: 26px;
            color: #667085;
            cursor: pointer;
        }

        .modal-body {
            padding: 18px;
            overflow: auto;
        }

        .modal-foot {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 12px 18px;
            border-top: 1px solid var(--border);
            background: #fbfdff;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 16px;
        }

        .modal-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .modal-field.full {
            grid-column: 1 / -1;
        }

        .modal-field label {
            font-size: 13px;
            color: #344054;
            font-weight: 900;
        }

        .modal-field input,
        .modal-field select {
            width: 100%;
            height: 40px;
            border: 1px solid #d6deeb;
            border-radius: 7px;
            padding: 0 10px;
            background: #fff;
        }

        .required {
            color: #ef4444;
        }

        .form-note {
            margin-top: 4px;
            font-size: 12px;
            color: var(--muted);
        }

        .paycode-logo-upload {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .paycode-logo-preview {
            width: 72px;
            height: 72px;
            border: 1px solid #d6deeb;
            border-radius: 8px;
            background: #f8fafc;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: #98a2b3;
            font-size: 11px;
            text-align: center;
        }

        .paycode-logo-preview img,
        .paycode-logo-thumb {
            object-fit: contain;
            background: #fff;
        }

        .paycode-logo-preview img {
            width: 100%;
            height: 100%;
        }

        .paycode-logo-thumb {
            width: 42px;
            height: 42px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
        }

        .toast {
            position: fixed;
            right: 18px;
            bottom: 18px;
            background: #111;
            color: #fff;
            border-radius: 8px;
            padding: 10px 14px;
            z-index: 500;
            box-shadow: 0 12px 28px rgba(0, 0, 0, .25);
            opacity: 0;
            transform: translateY(10px);
            transition: .25s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: none;
        }

        .placeholder-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 22px;
            box-shadow: var(--shadow);
        }

        .placeholder-card h2 {
            margin-top: 0;
        }

        .setting-page {
            max-width: 1180px;
        }

        .setting-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 14px;
            padding: 14px 16px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }

        .setting-toolbar-title {
            font-size: 14px;
            font-weight: 900;
            color: #344054;
        }

        .setting-toolbar-note {
            margin-top: 4px;
            font-size: 12px;
            color: var(--muted);
        }

        .publish-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .publish-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 9px;
            border-radius: 999px;
            background: #eef8f0;
            color: #16803d;
            font-size: 12px;
            font-weight: 900;
        }

        .publish-badge.draft {
            background: #fff7df;
            color: #9a6700;
        }

        .setting-section {
            margin-bottom: 14px;
            overflow: hidden;
        }

        .setting-section-head {
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            background: #fbfdff;
        }

        .setting-section-head h2 {
            margin: 0;
            font-size: 17px;
        }

        .setting-section-head p {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 12px;
        }

        .setting-list {
            background: #fff;
        }

        .setting-row {
            display: grid;
            grid-template-columns: minmax(220px, 1.2fr) minmax(300px, 2fr) 130px;
            align-items: center;
            gap: 18px;
            min-height: 78px;
            padding: 14px 18px;
            border-bottom: 1px solid #edf0f3;
        }

        .setting-row:last-child {
            border-bottom: 0;
        }

        .setting-name {
            font-size: 14px;
            font-weight: 900;
            color: #1f2937;
        }

        .setting-desc {
            margin-top: 5px;
            font-size: 12px;
            line-height: 1.55;
            color: var(--muted);
        }

        .setting-desc.important {
            color: #b54708;
            font-weight: 700;
        }

        .setting-switch-wrap {
            display: flex;
            justify-content: flex-end;
        }

        .setting-extra { display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
        .setting-extra[hidden] { display:none !important; }
        .setting-extra-label { color:#475467; font-size:12px; font-weight:800; white-space:nowrap; }
        .setting-number { width:120px; height:34px; border:1px solid #d6deeb; border-radius:6px; padding:0 10px; background:#fff; font-size:13px; }
        .setting-number.small { width:82px; }
        .setting-unit { color:#667085; font-size:12px; font-weight:700; }

        .setting-switch-label {
            min-width: 54px;
            font-size: 12px;
            font-weight: 900;
            color: #667085;
        }

        .setting-row.is-on .setting-switch-label {
            color: var(--success);
        }

        .publish-footer {
            position: sticky;
            bottom: 0;
            z-index: 20;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 14px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, .96);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 -4px 16px rgba(15, 23, 42, .06);
            backdrop-filter: blur(6px);
        }

        .kyc-pagination{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:14px 16px;font-size:12px;color:#667085}.kyc-bottom-tip{font-size:12px;color:#667085;margin-top:12px}.kyc-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.kyc-form-grid .full{grid-column:1/-1}.kyc-form-grid textarea{width:100%;border:1px solid #d6deeb;border-radius:7px;padding:10px;font:inherit;resize:vertical}.kyc-form-grid .modal-field input{min-width:0}.kyc-secret{display:flex;gap:6px}.kyc-secret input{flex:1;min-width:0}.kyc-secret button{border:1px solid #d6deeb;border-radius:6px;background:#f8fafc;cursor:pointer;padding:0 12px}.kyc-section{border-top:1px solid #edf0f3;padding-top:14px}.kyc-checks{display:flex;flex-wrap:wrap;gap:12px}.kyc-checks label{border:1px solid #d6deeb;border-radius:8px;padding:12px;flex:1;min-width:220px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.kyc-checks input{width:16px!important;height:16px!important;accent-color:#2d7fd8}.kyc-checks small{width:100%;font-size:11px;font-weight:400;color:#667085;margin-left:24px}.kyc-preview{background:#f5f9ff;border:1px solid #dbeafe;border-radius:8px;padding:12px;color:#344054;font-size:12px}.kyc-preview #kycPreviewText{margin:8px 0 12px;line-height:1.5}.kyc-notice-fields{gap:9px}.kyc-form-grid .status-switch input{width:auto;height:auto}.kyc-form-grid .status-switch{align-self:flex-start}
        @media(max-width:760px){.kyc-form-grid{grid-template-columns:1fr}.kyc-form-grid .full{grid-column:auto}}
        @media (max-width: 760px) {
            .setting-toolbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .setting-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .setting-switch-wrap {
                justify-content: flex-start;
            }
        }

        @media (max-width: 1100px) {
            .filter-grid {
                grid-template-columns: repeat(2, minmax(160px, 1fr));
            }

            .clock {
                display: none;
            }
        }

        @media (max-width: 900px) {
            .sidebar {
                position: fixed;
                left: -270px;
                top: var(--header-h);
                z-index: 80;
                width: 260px;
                flex-basis: 260px;
                transition: left .2s;
            }

            .sidebar.open {
                left: 0;
            }

            .tabs,
            .user span {
                display: none;
            }

            .filter-grid,
            .modal-grid {
                grid-template-columns: 1fr;
            }

            .modal-field.full {
                grid-column: auto;
            }

            .country-context {
                margin-left: auto;
            }
        }

        /* KYC Management and Block */
        .km-summary{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px;margin-bottom:14px}
        .km-stat{background:#fff;border:1px solid var(--border);border-radius:9px;padding:15px;box-shadow:var(--shadow)}
        .km-stat strong{display:block;font-size:24px;margin-top:7px;color:#1d4e89}
        .km-pill{display:inline-block;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;background:#edf2f7;color:#475569}
        .km-pill.approved,.km-pill.active{background:#dcfce7;color:#166534}
        .km-pill.rejected,.km-pill.frozen{background:#fee2e2;color:#991b1b}
        .km-pill.pending{background:#fef3c7;color:#92400e}
        .km-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        .km-tools button{white-space:nowrap}
        .km-table{min-width:1150px}
        .km-modal{width:min(900px,100%)}
        .km-modal textarea{width:100%;border:1px solid #d6deeb;border-radius:7px;padding:10px;min-height:80px;font:inherit}
        .km-modal .table{min-width:690px}
        .km-tip{font-size:12px;color:#667085;line-height:1.6;margin:12px 0}
        @media(max-width:760px){.km-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.km-stat strong{font-size:19px}}
        .km-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
        .km-step-cell{min-width:98px;display:flex;flex-direction:column;gap:5px}
        .km-step-label{font-size:12px;font-weight:800;color:#344054}

            const legacy = key => setting[key];

                const legacyKey = name.charAt(0).toLowerCase() + name.slice(1);
                ensure('curp' + name, typeof legacy(legacyKey) === 'boolean' ? legacy(legacyKey) : validatorKycDefaults['curp' + name]);

        function renderMenu() {
            menu.innerHTML = menuData.map((item, index) => sectionHtml(item, index)).join('');

        function sectionHtml(item, index) {
            const hasChildren = item.children && item.children.length;
            return `
                <div class="menu-section ${item.title === 'Finance Management' ? 'open' : ''}" data-path="${index}">
                    <div class="menu-item" data-page="${hasChildren ? '' : item.title}">
                        <span class="menu-icon">${item.icon}</span>
                        <span class="menu-label">${item.title}</span>
                        ${hasChildren ? '<span class="chev">⌄</span>' : ''}
                    </div>
                    ${hasChildren ? `<div class="submenu">${childrenHtml(item.children, index)}</div>` : ''}
                </div>
            `;
        }

        function childrenHtml(children, parentPath) {
            return children.map((child, index) => {
                const path = `${parentPath}-${index}`;
                if (typeof child === 'string') {
                    return `
                        <div class="sub" data-page="${child}" data-path="${path}">
                            <span class="dot"></span>
                            <span class="sub-label">${child}</span>
                        </div>
                    `;
                }

                return `
                    <div class="sub parent" data-path="${path}">
                        <span class="dot"></span>
                        <span class="sub-label">${child.title}</span>
                        <span class="chev">⌄</span>
                    </div>
                    <div class="nested">${childrenHtml(child.children || [], path)}</div>
                `;
            }).join('');
        }

        function renderTabs() {
            tabsEl.innerHTML = state.tabs.map(tab => `
                <div class="tab ${tab.title === state.activeTab ? 'active' : ''}" data-tab="${tab.title}">
                    <span>${tab.title}</span>
                    ${tab.closable ? `<span class="close" data-close="${tab.title}">×</span>` : ''}
                </div>
            `).join('');
        }

        function addTab(title) {
            if (!state.tabs.some(tab => tab.title === title)) {
                state.tabs.push({ title, closable: title !== 'Home' });
            }
            activateTab(title);
        }

        function activateTab(title) {
            state.activeTab = title;
            renderTabs();
            renderContent(title);
            setActiveMenu(title);
        }

        function closeTab(title) {
            if (title === 'Home') return;
            const index = state.tabs.findIndex(tab => tab.title === title);
            if (index < 0) return;

            state.tabs.splice(index, 1);

            if (state.activeTab === title) {
                state.activeTab = state.tabs[Math.max(0, index - 1)]?.title || 'Home';
            }

            renderTabs();
            renderContent(state.activeTab);
            setActiveMenu(state.activeTab);
        }

        function setActiveMenu(title) {
            document.querySelectorAll('.sub.active').forEach(el => el.classList.remove('active'));

            let sub = null;

            // Merchant 在 Casino Management 与 Finance Management 都存在。
            // Finance Management 的 Merchant 页面需明确选中 Finance Management 下的菜单项，
            // 避免因为找到前面的 Casino Merchant 而没有正确显示选中色。
            if (title === 'Merchant') {
                const financeSection = [...document.querySelectorAll('.menu-section')].find(section => {
                    const label = section.querySelector(':scope > .menu-item .menu-label');
                    return label && label.textContent.trim() === 'Finance Management';
                });

                sub = financeSection
                    ? financeSection.querySelector('.sub[data-page="Merchant"]')
                    : null;
            }

            if (!sub) {
                sub = [...document.querySelectorAll('.sub[data-page]')].find(
                    el => el.dataset.page === title
                );
            }

            if (sub) {
                sub.classList.add('active');

                let parent = sub.parentElement;

                while (parent) {
                    if (parent.classList?.contains('submenu')) {
                        parent.closest('.menu-section')?.classList.add('open');
                    }

                    if (parent.classList?.contains('nested')) {
                        parent.classList.add('open');
                        parent.previousElementSibling?.classList.add('open');
                    }

                    parent = parent.parentElement;
                }
            }
        }

        // CURP validation: structure, date, century discriminator, checksum and DOB match.

        function kmCurpDob(curp){
            curp=String(curp||'').trim().toUpperCase();
            if(curp.length!==18 || !/^\d{6}$/.test(curp.slice(4,10)))return null;
            const yy=Number(curp.slice(4,6)),century=/^[0-9]$/.test(curp[16])?1900:/^[A-Z]$/.test(curp[16])?2000:null;
            if(century===null)return null;
            const year=century+yy,month=Number(curp.slice(6,8)),day=Number(curp.slice(8,10));

            if(date.getUTCFullYear()!==year||date.getUTCMonth()+1!==month||date.getUTCDate()!==day)return null;
            return String(year).padStart(4,'0')+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');

        function kmCurpValidation(value,birthday){
            const curp=String(value||'').trim().toUpperCase();
            if(!curp)return {ok:false,message:'请输入 CURP（18 位）'};
            if(curp.length!==18)return {ok:false,message:'CURP 必须为 18 位，目前为 '+curp.length+' 位'};
            if(!/^[A-Z][AEIOUX][A-Z]{2}\d{6}[HM](?:AS|BC|BS|CC|CL|CM|CS|CH|DF|DG|GT|GR|HG|JC|MC|MN|MS|NT|NL|OC|PL|QT|QR|SP|SL|SR|TC|TS|TL|VZ|YN|ZS|NE)[B-DF-HJ-NP-TV-Z]{3}[A-Z0-9][0-9]$/.test(curp))return {ok:false,message:'CURP 结构错误：请检查姓名字母、出生日期、性别 H/M、州代码、内部辅音及世纪码'};
            const dob=kmCurpDob(curp);
            if(!dob)return {ok:false,message:'CURP 编码的出生日期不存在，请检查 YYMMDD 与世纪码'};
            const dict='0123456789ABCDEFGHIJKLMNÑOPQRSTUVWXYZ';
            let sum=0;
            for(let i=0;i<17;i++){
                const index=dict.indexOf(curp[i]);
                if(index<0)return {ok:false,message:'CURP 包含不允许的字符'};
                sum+=index*(18-i);
            }
            const expected=(10-sum%10)%10;
            if(Number(curp[17])!==expected)return {ok:false,message:'CURP 校验位错误：第 18 位应为 '+expected};
            if(!birthday)return {ok:false,message:'请填写 Birthday，CURP 对应生日为 '+dob};

        function payCodeLogoUploadHtml(inputId, previewId, value = '') {
            return `
                <div class="paycode-logo-upload">

        function handlePayCodeLogoUpload(inputId, previewId) {
            const input = document.getElementById(inputId);
            const preview = document.getElementById(previewId);
            const valueInput = document.getElementById(`${inputId}Value`);
            const file = input?.files?.[0];

            if (!file || !preview || !valueInput) return;
            if (!file.type.startsWith('image/')) {
                toast('请选择图片文件');
                input.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = () => {
                const dataUrl = String(reader.result || '');
                valueInput.value = dataUrl;
                preview.innerHTML = `<img src="${dataUrl}" alt="Logo Preview">`;
            };
            reader.readAsDataURL(file);
        }

        function syncPayCodeTypeFields() {
            const isWithdraw = $('#payCodeTypeInput')?.value === 'withdraw';
            const accountField = $('#payCodeAccountTypeField');
            const bankField = $('#payCodeBankCodeField');

            if (accountField) accountField.style.display = isWithdraw ? '' : 'none';
            if (bankField) bankField.style.display = isWithdraw ? '' : 'none';

        function getPayCodeOptions(currency, type) {
            const mapping = {
                BRL: {
                    deposit: ['PIX'],
                    withdraw: ['PIX']
                },
                MXN: {
                    deposit: ['OXXO', 'STP'],
                    withdraw: ['STP']
                },
                USD: {
                    deposit: ['GooglePay'],
                    withdraw: ['GooglePay']
                }
            };

            return mapping[currency]?.[type] || [];
        }

        function syncPayCodeOptions(preferredValue = '') {
            const currency = $('#payCodeCurrencyInput')?.value || '';
            const type = $('#payCodeTypeInput')?.value || '';
            const select = $('#payCodeValueInput');

            if (!select) return;

            const options = getPayCodeOptions(currency, type);
            const selectedValue = options.includes(preferredValue)
                ? preferredValue
                : (options[0] || '');

            select.innerHTML = options.map(value => `
                <option value="${escapeHtml(value)}" ${value === selectedValue ? 'selected' : ''}>
                    ${escapeHtml(value)}
                </option>
            `).join('');
        }

        function savePayCodeModal() {
            const payCodeName = $('#payCodeNameInput').value.trim();
            const merchant = $('#payCodeMerchantInput').value;
            const currency = $('#payCodeCurrencyInput').value;
            const type = $('#payCodeTypeInput').value;
            const payCode = $('#payCodeValueInput').value;
            const logoBefore = $('#payCodeLogoBeforeInputValue')?.value || '';
            const logoAfter = $('#payCodeLogoAfterInputValue')?.value || '';
            const currentRow = editingPayCodeId ? getPayCodeById(editingPayCodeId) : null;
            const status = currentRow?.status || 'Enabled';

            const accountType = type === 'withdraw' ? $('#payCodeAccountTypeInput').value : '-';
            const bankCode = type === 'withdraw' ? $('#payCodeBankCodeInput').value : '-';

            if (!payCodeName) {
                toast('请输入 PayCode 名称');
                return;
            }

            if (!payCode) {
                toast('请输入 Pay Code');
                return;
            }

            if (!logoBefore) {
                toast('请上传点击前 Logo');
                return;
            }

            if (!logoAfter) {
                toast('请上传点击后 Logo');
                return;
            }

            if (type === 'withdraw' && !accountType) {
                toast('Withdraw 请先选择 AccountType');
                return;
            }

            if (type === 'withdraw' && !bankCode) {
                toast('Withdraw 请先选择 Bank Code');
                return;
            }

            const current = editingPayCodeId ? getPayCodeById(editingPayCodeId) : null;
            const timestamp = nowText();

            const data = {
                id: current ? current.id : Math.max(0, ...payCodeRows.map(row => Number(row.id))) + 1,
                payCodeName,
                accountType,
                bankCode,
                payCode,
                logoBefore,
                logoAfter,
                merchant,
                currency,
                type,
                status,
                createdBy: current?.createdBy || 'Admin',
                createdDate: current?.createdDate || timestamp,
                updatedBy: 'Admin',
                updatedAt: timestamp
            };

            if (current) {
                Object.assign(current, data);
            } else {
                payCodeRows.unshift(data);
            }

            saveState(STORE_PAYCODE, payCodeRows);
            closePayCodeModal();
            renderContent('PayCode');
            toast('PayCode saved');
        }

                    addTab(item.dataset.page);

                if (sub.classList.contains('parent')) {

                addTab(sub.dataset.page);

        content.addEventListener('change', event => {
            if(handleNewKycChange(event))return;
             const kStatus=event.target.closest('[data-kyc-status]');if(kStatus){const r=kycMerchants.find(x=>x.id===Number(kStatus.dataset.kycStatus));if(r){r.enabled=kStatus.checked;r.updatedAt=nowText();saveState(STORE_KYC_MERCHANT,kycMerchants);renderContent('KYC Merchant');toast('KYC status updated');}return;}

            const kycSetting = event.target.closest('[data-kyc-setting]');

            if (kycSetting) {
                updateKycDraftSetting(kycSetting.dataset.kycSetting, kycSetting.checked);
                return;
            }

            const merchantStatus = event.target.closest('[data-merchant-status]');

            if (merchantStatus) {
                const row = getMerchantById(merchantStatus.dataset.merchantStatus);

                if (row) {
                    row.status = merchantStatus.checked ? 'Enabled' : 'Disabled';
                    row.updatedBy = 'Admin';
                    row.updatedAt = nowText();
                    saveState(STORE_MERCHANT, merchantRows);

                    const text = merchantStatus
                        .closest('.status-switch')
                        ?.querySelector('.status-switch-text');

                    if (text) {
                        text.textContent = merchantStatus.checked ? '启动' : '关闭';
                    }

                    toast(
                        merchantStatus.checked
                            ? 'Merchant status enabled'
                            : 'Merchant status disabled'
                    );
                }

                return;
            }

            const status = event.target.closest('[data-paycode-status]');

            if (!status) return;

            const row = getPayCodeById(status.dataset.paycodeStatus);

            if (row) {
                row.status = status.checked ? 'Enabled' : 'Disabled';
                row.updatedBy = 'Admin';
                row.updatedAt = nowText();
                saveState(STORE_PAYCODE, payCodeRows);

                const text = status.closest('.status-switch')?.querySelector('.status-switch-text');
                if (text) text.textContent = status.checked ? '启动' : '关闭';

                toast(status.checked ? 'Status enabled' : 'Status disabled');
            }
        });

        content.addEventListener('input', event => {
            const numericInput = event.target.closest('[data-kyc-number]');
            if (!numericInput) return;
            const cleaned = updateKycNumericSetting(numericInput.dataset.kycNumber, numericInput.value);
            if (numericInput.value !== cleaned) numericInput.value = cleaned;
        });

        $('#kycModalClose').addEventListener('click',closeKycModal);
        $('#kycModalCancel').addEventListener('click',closeKycModal);
        $('#kycModalSave').addEventListener('click',saveKycModal);
        $('#kycModalMask').addEventListener('click',e=>{if(e.target.id==='kycModalMask')closeKycModal()});
        $('#kycModalBody').addEventListener('click',e=>{const show=e.target.closest('[data-kyc-show]');if(show){const input=document.getElementById(show.dataset.kycShow);input.type=input.type==='password'?'text':'password';show.textContent=input.type==='password'?'Show':'Hide';}if(e.target.id==='kycPreviewToggle'){e.target.dataset.mode=e.target.dataset.mode==='withdraw'?'deposit':'withdraw';syncKycNotice();}});
        $('#kycModalBody').addEventListener('input',e=>{if(['kDepositText','kWithdrawText'].includes(e.target.id))syncKycNotice()});
        $('#kycModalBody').addEventListener('change',e=>{if(e.target.id==='kNotice')syncKycNotice();if(e.target.id==='kEnabled'){$('#kEnabled').closest('label').querySelector('.status-switch-text').textContent=e.target.checked?'Enabled':'Disabled';}});
        $('#merchantModalClose').addEventListener('click', closeMerchantModal);
        $('#merchantModalCancel').addEventListener('click', closeMerchantModal);
        $('#merchantModalSave').addEventListener('click', saveMerchantModal);
        $('#merchantModalMask').addEventListener('click', event => {
            if (event.target === $('#merchantModalMask')) closeMerchantModal();
        });

        $('#merchantModalBody').addEventListener('change', event => {
            if (event.target.id !== 'merchantStatusInput') return;

            const text = $('#merchantStatusText');
            if (text) {
                text.textContent = event.target.checked ? 'Enabled' : 'Disabled';
            }
        });

        $('#payCodeModalClose').addEventListener('click', closePayCodeModal);
        $('#payCodeModalCancel').addEventListener('click', closePayCodeModal);
        $('#payCodeModalSave').addEventListener('click', savePayCodeModal);
        $('#payCodeModalMask').addEventListener('click', event => {
            if (event.target === $('#payCodeModalMask')) closePayCodeModal();
        });

        $('#payCodeModalBody').addEventListener('change', event => {
            if (event.target.id === 'payCodeLogoBeforeInput') {
                handlePayCodeLogoUpload('payCodeLogoBeforeInput', 'payCodeLogoBeforePreview');
                return;
            }

            if (event.target.id === 'payCodeLogoAfterInput') {
                handlePayCodeLogoUpload('payCodeLogoAfterInput', 'payCodeLogoAfterPreview');
                return;
            }

            if (event.target.id === 'payCodeTypeInput') {
                syncPayCodeTypeFields();
                syncPayCodeOptions();
                return;
            }

            if (event.target.id === 'payCodeCurrencyInput') {
                syncPayCodeOptions();
            }
        });
$('#confirmClose').addEventListener('click', closeConfirm);
        $('#confirmCancel').addEventListener('click', closeConfirm);
        $('#confirmMask').addEventListener('click', event => {
            if (event.target === $('#confirmMask')) closeConfirm();
        });
        $('#confirmOk').addEventListener('click', () => {
            const callback = confirmCallback;
            closeConfirm();
            if (callback) callback();
        });

        $('#menuToggle').addEventListener('click', () => {
            if (window.innerWidth <= 900) {
                sidebar.classList.toggle('open');
            } else {
                document.body.classList.toggle('collapsed');
            }
        });

        function tick() {
            const d = new Date();
            const z = n => String(n).padStart(2, '0');
            $('#clock').textContent =
                `Local ${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())} (+08:00)`;
        }

        renderMenu();
        renderTabs();
        renderContent('Home');
        tick();
        setInterval(tick, 1000);

        // Open System Management > KYC Setting by default.
        addTab('KYC Merchant');
    </script>
</body>
</html>
