<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEGWIN | KYC Verification</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0c;
        --top: #1b1b1d;
        --panel: #1b1b1d;
        --panel2: #232326;
        --line: #323236;
        --text: #eeeef0;
        --muted: #96969a;
        --teal: #41d2bf;
        --red: #ef535c;
        --yellow: #e6bd5b;
        --font: Inter, "Segoe UI", Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
      }
      button,
      input,
      select {

      }
      button {
        cursor: pointer;
      }
      button:disabled {

        opacity: 0.45;
      }
      .topline {
        height: 42px;
        background: var(--top);
        border-bottom: 1px solid #2b2b2d;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        color: #a3a3a8;
        font-size: 12px;
      }
      .topline .right {
        display: flex;
        gap: 24px;
        align-items: center;
      }
      .nav {
        height: 49px;
        display: flex;
        align-items: center;
        gap: 30px;
        padding: 0 18px;
        border-bottom: 1px solid #272729;
        background: #0e0e0f;
      }
      .hamburger {
        font-size: 22px;
        color: #f3f3f3;
      }
      .brand {
        font-size: 29px;
        font-weight: 950;
        letter-spacing: -1.8px;
        font-style: italic;
        white-space: nowrap;
      }
      .brand em {
        color: var(--teal);
        font-style: italic;
      }
      .navlinks {
        display: flex;
        gap: 20px;
        align-items: center;
        color: #8f8f93;
        font-size: 12px;
        font-weight: 700;
      }
      .navlinks span.active {
        color: #f5f5f5;
        background: #262629;
        padding: 9px 13px;
        border-radius: 24px;
      }
      .nav-right {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .nav-chip {
        background: #1e1e20;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 12px;
        color: #bcbcc0;
      }
      .avatar {

        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #2b2b2f;
        color: #929298;
      }
      .shell {

        gap: 12px;
      }
      .sidebar {
        padding: 12px 10px;
        min-height: calc(100vh - 91px);
      }
      .menu {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 10px;
        color: #939397;
        font-weight: 650;
        margin-bottom: 3px;
        white-space: nowrap;
      }
      .menu.active {
        background: #27272a;
        color: #f1f1f3;
      }
      .menu .mi {
        width: 18px;
        text-align: center;
        color: #77777c;
      }
      .menu.active .mi {
        color: #fff;
      }
      .main {
        padding: 12px 22px 70px 0;
      }
      .kyc {

        background: var(--panel);
        border-radius: 12px;
        padding: 24px 23px 22px;
        min-height: 294px;
      }

        margin: 0 0 11px;

      }
      .muted {

      }
      .small {

      }
      .uploads {

        gap: 8px;
        margin: 16px 0 14px;

      .upload {

        min-height: 60px;

        justify-content: center;

        padding: 10px;
        background: #1b1b1d;
        color: #ddd;
        font-size: 12px;
        text-align: center;

      }

      .divider {

      }
      .notice li {

      }

      }
      .btn {

        border-radius: 9px;
        padding: 12px 17px;
        font-weight: 700;
        min-height: 43px;
      }
      .btn-main {
        background: var(--teal);

      }
      .btn-main:hover:not(:disabled) {

      }
      .btn-soft {

      }
      .btn-outline {

      .row {

        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .split {

        align-items: center;
        gap: 10px;
      }
      .badge {

      .tip {

        line-height: 1.55;

      .choice {

      .field {

        color: #aaa;

      .input {

        color: #eee;

        padding: 12px;

      }
      .input:focus {
        border-color: var(--teal);
      }
      .preview {
        border: 1px dashed #515158;
        background: #202023;
        border-radius: 12px;
        min-height: 180px;
        display: flex;
        flex-direction: column;

        align-items: center;
        text-align: center;
        padding: 20px;

      .result {

        line-height: 1.55;
        font-size: 13px;
      }
      .result .btn {
        width: min(455px, 100%);
        margin-top: 16px;
      }
      .result.good .symbol {
        color: var(--teal);

      .result.bad .symbol {
        color: var(--red);

      .result.pending .symbol {

      .status-line {

        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: #a5a5aa;
        margin: 12px 0 0;
      }
      .dot {
        width: 8px;
        height: 8px;
        background: var(--yellow);
        border-radius: 50%;
      }
      .demo-switch {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #999;
        margin: 14px 0 0;
      }
      .demo-switch input {
        accent-color: var(--teal);
      }
      .demo-controls {
        margin-top: 15px;
        border-top: 1px solid #353539;
        padding-top: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .demo-controls .btn {
        min-height: 34px;
        padding: 7px 12px;
        font-size: 12px;
      }
      .demo-label {
        font-size: 11px;
        color: #b8a26a;
        margin-right: 4px;
      }
      .hide {
        display: none !important;
      }
      .error {
        color: #ff888e;
        font-size: 12px;
        margin-top: 8px;
      }
      .footer-note {
        margin-top: 15px;
        font-size: 11px;
        color: #6f6f75;
      }
      .camera-circle {
        height: 112px;
        width: 112px;
        border: 2px dashed #64cbbb;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 53px;
        margin: 10px auto;
      }
      .checkboxline {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 12px;
        color: #b7b7bc;
        line-height: 1.5;
        margin: 17px 0;
      }
      .checkboxline input {
        accent-color: var(--teal);
        margin-top: 2px;
      }
      .back {
        background: transparent;
        border: 0;
        color: #a9a9af;
        padding: 12px 0;
      }
      .api-info {
        font-size: 11px;
        color: #8f8f95;
        margin-top: 10px;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 4px solid #37373b;
        border-top-color: var(--teal);
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (max-width: 1050px) {
        .navlinks {
          gap: 9px;
        }
        .shell {
          grid-template-columns: 205px minmax(0, 1fr);
        }
        .main {
          padding-right: 12px;
        }
      }
      @media (max-width: 760px) {
        .topline {
          height: 30px;
          padding: 0 12px;
        }
        .topline .right {
          gap: 12px;
        }
        .nav {
          height: 55px;
          padding: 0 12px;
          gap: 12px;
        }
        .brand {
          font-size: 25px;
        }
        .navlinks {
          display: none;
        }
        .nav-chip:nth-child(1) {
          display: none;
        }
        .shell {
          display: block;
        }
        .sidebar {
          min-height: auto;
          padding: 10px 12px 0;
          display: flex;
          overflow-x: auto;
          gap: 4px;
        }
        .menu {
          font-size: 12px;
          min-width: max-content;
          padding: 10px 12px;
        }
        .menu:not(.active) {
          display: none;
        }
        .main {
          padding: 12px 12px 35px;
        }
        .kyc {
          padding: 20px 15px;
          border-radius: 10px;
        }
        .kyc h1 {
          font-size: 25px;
        }
        .uploads {
          grid-template-columns: 1fr;
        }
        .notice {
          font-size: 12px;
        }
        .result {
          padding: 30px 4px 16px;
        }
        .result .symbol {
          font-size: 61px;
        }
        .flow {
          margin-top: 4px;
        }
      }

      /* CURP entry and guidance */
      .personal-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 16px;
      }
      .personal-grid .full {
        grid-column: 1/-1;
      }
      .personal-grid .field {
        margin: 0 0 7px;
      }
      .personal-grid .input {
        min-height: 47px;
      }
      .personal-grid input[type="date"] {
        color-scheme: dark;
      }
      .form-heading {
        font-size: 15px;
        font-weight: 750;
        margin: 20px 0 14px;
      }
      .personal-note {
        font-size: 12px;
        color: #aaa;
        line-height: 1.6;
        margin: 10px 0 0;
      }
      .curp-form {
        max-width: 620px;
        margin-top: 18px;
      }
      .curp-input {
        font-size: 16px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        font-weight: 650;
        height: 49px;
      }
      .required {
        color: var(--red);
      }
      .helper {
        font-size: 12px;
        color: var(--muted);
        margin-top: 9px;
        line-height: 1.5;
      }
      .steps-guide {
        margin-top: 18px;
      }
      .steps-guide h3 {
        font-size: 15px;
        margin: 0 0 7px;
      }
      .guide-row {
        display: flex;
        gap: 13px;
        align-items: flex-start;
        padding: 14px 0;

      }
      .guide-row:last-child {
        border-bottom: 0;

      .guide-number {
        display: grid;
        place-items: center;
        width: 29px;
        height: 29px;
        flex: 0 0 29px;
        border-radius: 50%;

        border: 1px solid #32655e;
        color: var(--teal);
        font-size: 13px;
        font-weight: 800;

      .guide-row strong {
        font-size: 13px;

      .guide-row p {
        font-size: 12px;
        color: #99999e;

      }
      .curp-form .field {
        margin-top: 0;
      }
      .checkboxline a {
        text-decoration: underline;

      }
      @media (max-width: 760px) {
        .personal-grid {
          grid-template-columns: 1fr;
        }
        .guide-row {
          padding: 12px 0;
        }
        .curp-form {
          max-width: 100%;
        }
      }
    
      .doc-section{border:1px solid #3a3a3e;border-radius:12px;padding:18px;margin:17px 0;background:#202023}
      .doc-section h3{margin:0 0 7px;font-size:15px;color:#f0f0f2}
      .doc-result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}

      /* Post-Step-4 review and final verification states */
      .kyc:has(.verification-final){min-height:295px}
      .verification-final{text-align:center;padding:36px 12px 4px}

      .step-panel .preview{margin:20px 0;min-height:210px}.step-panel .row{justify-content:space-between}

      @media(max-width:760px){.unico-steps{grid-template-columns:repeat(2,minmax(0,1fr))}.unico-step{padding:10px}.step-panel h2{font-size:19px}}
      </style>
  </head>

    <div class="topline">

    <script>
    "use strict";
    // Preview only. Real identity verification requires a secured MEGWIN backend and an enabled Unico recipe.
    const live = new URLSearchParams(location.search).get('mode') === 'live';
    const steps = [
      {title:'Prueba de vida',desc:'Unico utiliza la cámara para comprobar que eres una persona real.',icon:'◉',detail:'Coloca tu rostro dentro del marco y sigue las indicaciones de la cámara.',note:'La captura biométrica real se realiza dentro de la sesión segura de Unico.'},
      {title:'Verificación de identidad',desc:'Comprobación de identidad y, si está habilitado, consulta de datos CURP / RENAPO.',icon:'▣',detail:'Unico verifica los datos de identidad vinculados a la sesión.',note:'La validación RENAPO depende de las capacidades habilitadas para tu cuenta.'},
      {title:'Evaluación de riesgo de fraude',desc:'Clasificación de señales de riesgo e inconsistencias detectadas.',icon:'⬡',detail:'El sistema analiza los indicadores de fraude disponibles.',note:'La decisión final de KYC corresponde al servidor de MEGWIN.'},
      {title:'Captura y reutilización de documentos',desc:'Captura de identificación y reutilización, según el flujo habilitado.',icon:'▤',detail:'Prepara tu documento oficial y sigue las instrucciones de Unico.',note:'Los documentos admitidos y el orden real de captura dependen del recipe contratado.'}
    ];
    const state={page:0,applicationId:null,busy:false,error:'',identity:{curp:'',dob:'',fullName:''},validators:['idle','idle','idle'],validatorMessages:['','',''],documentResult:{status:'NOT_RECEIVED',capture:'NOT_RECEIVED',reuse:'NOT_RECEIVED',documentType:'',reference:''}};
    const screen=document.getElementById('screen'), badge=document.getElementById('stateBadge');
    const button=(label,action,kind='btn-main')=>`<button type="button" class="btn ${kind}" data-action="${action}">${label}</button>`;
    const esc=(s)=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function progress(){return `<div class="unico-steps" aria-label="Etapas de verificación">${steps.map((s,i)=>`<div class="unico-step ${typeof state.page==='number'?(i<state.page?'done':i===state.page?'current':''):''}"><div class="step-head"><span class="number">${i+1}</span><span>${s.title}</span></div><p>${s.desc}</p></div>`).join('')}</div>`}
    function documentPanel(){
      const v=state.identity;
      return `<section class="doc-section"><h3>Datos personales · Confirmar o corregir</h3><p class="muted small">Revisa tus datos antes de continuar. Puedes corregirlos; los cambios no alteran el resultado original de Unico.</p><div class="personal-grid"><div class="full"><label class="field" for="docCurp">CURP <span class="required">*</span></label><input class="input curp-input" id="docCurp" data-identity="curp" maxlength="18" autocomplete="off" value="${esc(v.curp)}" placeholder="18 caracteres" /></div><div><label class="field" for="docDob">Fecha de nacimiento <span class="required">*</span></label><input class="input" type="date" id="docDob" data-identity="dob" value="${esc(v.dob)}" /></div><div><label class="field" for="docFullName">Nombre completo <span class="required">*</span></label><input class="input" id="docFullName" data-identity="fullName" maxlength="120" value="${esc(v.fullName)}" placeholder="Nombre y apellidos" /></div></div><p class="helper">Estos campos son editables y se guardan por separado de la evidencia del proveedor. La validación definitiva debe realizarse en el servidor.</p></section>
<div class="error ${state.error?'':'hide'}" id="identityError" role="alert">${esc(state.error)}</div>`;
    }
    function validateIdentity(){
      const v=state.identity, curp=v.curp.trim().toUpperCase();
      if(!/^[A-ZÑ][AEIOUX][A-ZÑ]{2}\d{6}[HM](?:AS|BC|BS|CC|CL|CM|CS|CH|DF|DG|GT|GR|HG|JC|MC|MN|MS|NT|NL|OC|PL|QT|QR|SP|SL|SR|TC|TS|TL|VZ|YN|ZS|NE)[B-DF-HJ-NP-TV-Z]{3}[A-Z0-9]\d$/.test(curp))return 'Ingresa un CURP con formato válido (18 caracteres).';
      if(!v.dob)return 'Selecciona tu fecha de nacimiento.';
      const yy=v.dob.slice(2,4),mm=v.dob.slice(5,7),dd=v.dob.slice(8,10);
      if(curp.slice(4,10)!==yy+mm+dd)return 'La fecha de nacimiento no coincide con el CURP.';
      const date=new Date(v.dob+'T12:00:00');if(!Number.isFinite(date.getTime())||date.toISOString().slice(0,10)!==v.dob)return 'La fecha de nacimiento no es válida.';
      if(!v.fullName.trim()||v.fullName.trim().split(/\s+/).length<2)return 'Ingresa nombre y apellidos.';
      return '';
    }
    function validatorPanel(n){
      const status=state.validators[n], msg=state.validatorMessages[n];
      const label=status==='passed'?'Validated':status==='failed'?'Validation failed':status==='checking'?'Validating…':status==='pending'?'Pending':'Not validated';
      return `<div class="row" style="gap:9px;justify-content:flex-start">${button(status==='checking'?'Validating…':'Validator','validate','btn-outline')}<span class="badge ${status==='passed'?'good':status==='failed'?'bad':''}">${label}</span></div>${msg?`<div class="helper" role="status">${esc(msg)}</div>`:''}`;
    }
    async function validateStep(n){
      state.validators[n]='checking';state.validatorMessages[n]='';render();
      try{
        if(live){
          // Backend contract to be implemented by MEGWIN; browser never holds provider credentials.
          const result=await api('/api/kyc/validators/'+(n+1),{method:'POST',body:JSON.stringify({applicationId:state.applicationId,step:n+1,provider:'UNICO'})});
          const status=String(result.status||'').toUpperCase();
          state.validators[n]=['PASSED','APPROVED','VERIFIED','SUCCESS'].includes(status)?'passed':status==='PENDING'||status==='PROCESSING'?'pending':'failed';
          state.validatorMessages[n]=result.message|| (state.validators[n]==='passed'?'Validación completada.':'Verificación no completada; revisa el resultado del proveedor.');
        }else{
          // Preview simulation only; no third-party call is performed.
          state.validators[n]='passed';state.validatorMessages[n]='Demo: validación simulada. No se llamó a Unico.';
        }
      }catch(err){state.validators[n]='failed';state.validatorMessages[n]=err.message||'Error de validación.';}
    }
    function render(){
      const n=state.page;
      badge.textContent=typeof n==='number'?'In progress':n==='approved'?'Verified':n==='rejected'?'Failed':n==='processing'?'Under review':'Attention';
      badge.className='badge'+(n==='approved'?' good':n==='rejected'||n==='error'?' bad':'');
      if(typeof n==='number'){
        const s=steps[n];
        screen.innerHTML=`${progress()}<div class="step-panel"><div class="split"><h2>Step ${n+1} — ${s.title}</h2><span class="badge">${n+1} / 4</span></div><p>${s.desc}</p>${n===3?documentPanel():`<div class="preview"><span class="illustration">${s.icon}</span><strong>${s.detail}</strong><span>${live?'La captura real se completará en Unico.':'Vista previa interactiva · No se utiliza la cámara ni se verifica la identidad.'}</span></div>`}<div class="tip">${s.note}</div><div class="row" style="justify-content:space-between;align-items:center"><div class="row">${n>0?button('← Volver','back','btn-soft'):''}${n<3?validatorPanel(n):''}</div>${n<3&&state.validators[n]!=='passed'?'<button type="button" class="btn btn-main" disabled>Continuar →</button>':button(n===3?(live?'Abrir verificación Unico':'Finalizar demostración'):'Continuar →',n===3?'submit':'next')}</div><div class="mode-note">${live?'Integración pendiente de un backend MEGWIN autenticado.':'Modo demostración · Los pasos no representan resultados reales de Unico.'}</div></div>`;
      }else if(n==='processing'){
        screen.innerHTML=`<div class="verification-final" aria-live="polite"><div class="review-spinner" aria-hidden="true"></div><h2>Verification in progress</h2><p>Your identity verification is being processed. You can check its status here. A return from Unico does not automatically mean approval.</p>${button('Check verification status','refresh','btn-soft')}${!live?`<div class="demo-controls"><span class="demo-label">Demo · Simular resultado</span>${button('Approved','approve','btn-outline')}${button('Rejected','reject','btn-outline')}</div>`:''}</div>`;
      }else if(n==='approved'||n==='rejected'){
        const success=n==='approved';
        screen.innerHTML=`<div class="verification-final"><div class="identity-symbol" aria-hidden="true">🪪<span class="outcome ${success?'ok':'no'}">${success?'✓':'!'}</span></div><h2>${success?'Your account is verified for Know Your Customer':'KYC verification of your account failed'}</h2><p>${success?'Please note, in certain circumstances we may require further information from you in accordance with our license conditions. We will contact you should this be necessary.':'Please confirm that the file you uploaded meets the requirements. It is important that we are able to positively identify our customers to comply with both regulatory requirements and to help ensure the security of accounts.'}</p>${success?'':button('Re-verification','retry','btn-soft')}${!live?`<div class="demo-controls"><span class="demo-label">Demo · ${success?'Simulated approval':'Simulated rejection'}</span>${success?button('Restart demo','reset','btn-outline'):''}</div>`:''}</div>`;
      }else{
        screen.innerHTML=`<div class="result bad"><div class="symbol">!</div><h2>No se pudo iniciar la verificación</h2><p>${esc(state.error)}</p>${button('Volver','reset','btn-soft')}</div>`;
      }
    }
    async function api(path,options={}){const r=await fetch(path,{credentials:'include',headers:{'Accept':'application/json',...(options.body?{'Content-Type':'application/json'}:{})},...options});if(!r.ok)throw Error('Error del servidor ('+r.status+')');return r.json()}
    async function startLive(){
      // No CURP or private keys are collected or exposed in this browser page.
      // The backend must create an authorized Unico session with the enabled recipe.
      const application=await api('/api/kyc/applications',{method:'POST',body:JSON.stringify({provider:'UNICO',locale:'es-MX',flow:'LIVENESS_IDENTITY_FRAUD_DOCUMENT'})});
      state.applicationId=application.applicationId||application.id;
      if(!state.applicationId)throw Error('Falta el ID de solicitud KYC.');
      const session=await api('/api/kyc/applications/'+encodeURIComponent(state.applicationId)+'/sessions',{method:'POST',body:JSON.stringify({device:innerWidth<768?'H5':'PC'})});
      const target=session.userRedirectUrl||session.redirectUrl;
      if(!target||new URL(target).protocol!=='https:')throw Error('URL de Unico no válida.');
      location.assign(target);
    }
    async function refresh(){const data=await api(state.applicationId?'/api/kyc/applications/'+encodeURIComponent(state.applicationId):'/api/kyc/status');const status=String(data.status||data.kycStatus||'PENDING').toUpperCase();state.page=['APPROVED','VERIFIED','PASSED'].includes(status)?'approved':['REJECTED','FAILED','NOT_APPROVED'].includes(status)?'rejected':'processing';render()}
    screen.addEventListener('input',e=>{const key=e.target.dataset.identity;if(!key)return;state.identity[key]=key==='curp'?e.target.value.toUpperCase():e.target.value;if(key==='curp'&&e.target.value!==state.identity[key])e.target.value=state.identity[key];const err=document.getElementById('identityError');if(err){err.textContent='';err.classList.add('hide')}});
    screen.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||state.busy)return;state.busy=true;try{switch(b.dataset.action){case 'validate':if(typeof state.page==='number'&&state.page<3)await validateStep(state.page);break;case 'next':if(state.page<3&&state.validators[state.page]!=='passed')break;state.page=Math.min(3,state.page+1);break;case 'back':state.page=Math.max(0,state.page-1);break;case 'submit':{const problem=validateIdentity();if(problem){state.error=problem;break}state.error='';if(live){await startLive();return}state.page='processing';break;}case 'refresh':if(live){await refresh();return}break;case 'approve':if(!live)state.page='approved';break;case 'reject':if(!live)state.page='rejected';break;case 'retry':state.page=0;state.error='';break;case 'reset':state.page=0;state.error='';break}}catch(err){state.error=err.message;state.page='error'}finally{state.busy=false;render()}});
    if(live)refresh().catch(()=>{state.page=0;render()});else render();
    </script>
  </body>
</html>
